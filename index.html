<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Військова англійська — курс</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#f4f5f7; --card:#fff; --fg:#15181d; --dim:#6b7280; --line:#dfe3e8;
  --accent:#2563eb; --ok:#15803d; --okbg:#dcfce7; --bad:#b91c1c; --badbg:#fee2e2;
  --warn:#a16207; --warnbg:#fef3c7;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#101215;--card:#181b20;--fg:#e8eaed;--dim:#9aa1ab;--line:#2a2f36;
        --accent:#60a5fa;--ok:#4ade80;--okbg:#14361f;--bad:#f87171;--badbg:#3a1618;
        --warn:#fbbf24;--warnbg:#3a2e0c;}
}
body.tg{
  --bg:var(--tg-theme-bg-color,#101215);
  --card:var(--tg-theme-secondary-bg-color,#181b20);
  --fg:var(--tg-theme-text-color,#e8eaed);
  --dim:var(--tg-theme-hint-color,#9aa1ab);
  --accent:var(--tg-theme-button-color,#60a5fa);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#wrap{max-width:820px;margin:0 auto;padding:12px 14px 80px}
h1{font-size:19px;margin:0 0 2px}
h2{font-size:17px;margin:14px 0 4px}
.sub{color:var(--dim);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:14px 15px;margin:10px 0}
.tap{cursor:pointer}
.tap:active{opacity:.7}
.card h3{margin:0 0 2px;font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
button{font:inherit}
.act{padding:11px 16px;border-radius:10px;border:1px solid var(--accent);
  background:var(--accent);color:#fff;font-size:15px;cursor:pointer}
.act:disabled{opacity:.45;cursor:default}
.ghost{padding:10px 14px;border-radius:10px;border:1px solid var(--line);
  background:transparent;color:var(--fg);font-size:15px;cursor:pointer}
.ghost.on{border-color:var(--accent);color:var(--accent)}
.small{font-size:13px;padding:7px 11px}
.back{color:var(--accent);font-size:14px;cursor:pointer;display:inline-block;margin:2px 0 6px}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.pill{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:2px 9px}
.pill.done{color:var(--ok);border-color:var(--ok)}
.pill.soon{color:var(--warn);border-color:var(--warn)}
.flash{min-height:150px;display:flex;flex-direction:column;justify-content:center;
  align-items:center;text-align:center;gap:8px;padding:22px 10px}
.big{font-size:26px;font-weight:600;line-height:1.25}
.mid{font-size:19px}
.expl{color:var(--dim);font-size:14px;max-width:34em}
.opts{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.opts button{text-align:left;padding:11px 13px;border:1px solid var(--line);border-radius:10px;
  background:transparent;color:var(--fg);font-size:15px;cursor:pointer}
.opts button.good{border-color:var(--ok);background:var(--okbg)}
.opts button.bad{border-color:var(--bad);background:var(--badbg)}
.opts button:disabled{cursor:default}
input.gap,input.tin{font:inherit;font-size:16px;padding:8px 11px;border:1px solid var(--line);
  border-radius:9px;background:var(--bg);color:var(--fg);width:100%;max-width:16em}
input.gap{padding:2px 7px;border:0;border-bottom:2px solid var(--accent);background:transparent;
  width:9.5em;border-radius:3px 3px 0 0;font-size:15px}
select.gap{font:inherit;font-size:15px;padding:3px 6px;border:1px solid var(--accent);
  border-radius:7px;background:var(--card);color:var(--fg);max-width:100%}
.gap.good,.tin.good{border-color:var(--ok);background:var(--okbg)}
.gap.bad,.tin.bad{border-color:var(--bad);background:var(--badbg)}
.gap.near,.tin.near{border-color:var(--warn);background:var(--warnbg)}
.fix{color:var(--bad);font-size:13px;margin-left:4px;white-space:nowrap}
.hint{color:var(--dim);font-size:13px}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.bank span{border:1px dashed var(--line);border-radius:7px;padding:3px 9px;font-size:13px;color:var(--dim)}
.line{display:flex;gap:8px;margin:7px 0;align-items:baseline}
.who{flex:0 0 22px;color:var(--accent);font-weight:600;font-size:13px}
.txt{flex:1}
p.para{margin:9px 0}
.score{font-size:14px;padding:8px 12px;border-radius:9px;background:var(--okbg);color:var(--ok);
  display:inline-block;margin-top:8px}
.score.low{background:var(--badbg);color:var(--bad)}
.steps{display:flex;gap:6px;margin:10px 0 4px}
.steps div{flex:1;text-align:center;font-size:12px;color:var(--dim);
  border-bottom:3px solid var(--line);padding-bottom:5px}
.steps div.on{color:var(--accent);border-color:var(--accent)}
.steps div.ok{color:var(--ok);border-color:var(--ok)}
.speak{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:8px;
  padding:4px 9px;font-size:15px;cursor:pointer}
.res{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:8px 14px;font-size:12px;color:var(--dim);display:flex;gap:12px;justify-content:center}
footer span{cursor:pointer}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:11px 0;border-top:1px solid var(--line)}
.list-item:first-child{border-top:0}
.grow{flex:1;min-width:0}
.nowrap{white-space:nowrap}
.tiny{font-size:12px;color:var(--dim)}
</style>
</head>

</footer>

ove","Blend"],"uadis":["Привод агрегатів","Теплова пастка","Електрогідравлічний клапан"],"k":"m1:Repair"},{"en":"Overhaul","ua":"Капітальний ремонт","ex":"Overhaul is a complete disassembly, inspection, and restoration of a unit.","cloze":"…… is a complete disassembly, inspection, and restoration of a unit.","acc":["overhaul"],"dis":["Rectify","Submit","Bleed"],"uadis":["Гвинт / Шуруп","Водовідділювач","Шайба"],"k":"m1:Overhaul"},{"en":"Withdraw","ua":"Витягти","ex":"To withdraw means to pull out, for example a pin or cartridge.","cloze":"To …… means to pull out, for example a pin or cartridge.","acc":["withdraw"],"dis":["Lubricate","Adjust","Secure"],"uadis":["Наповнити / Заправити","Конденсатор","Вузол підвіски"],"k":"m1:Withdraw"},{"en":"Detach","ua":"Відкріпити","ex":"To detach means to release something held by clips or locks.","cloze":"To …… means to release something held by clips or locks.","acc":["detach"],"dis":["Adjust","Torque","Connect"],"uadis":["Канал / Протока","Відбірне повітря","Окуляри нічного бачення"],"k":"m1:Detach"},{"en":"Attach","ua":"Прикріпити","ex":"To attach means to fix a component using fasteners.","cloze":"To …… means to fix a component using fasteners.","acc":["attach"],"dis":["Retract","Detach","Rectify"],"uadis":["Гідробак","Кут місця","Окуляри нічного бачення"],"k":"m1:Attach"},{"en":"Access","ua":"Доступ","ex":"Access means opening panels or hatches to reach internal components.","cloze":"…… means opening panels or hatches to reach internal components.","acc":["access"],"dis":["Blend","Replace","Connect"],"uadis":["Плашка","Лопатка","Дріт заземлення"],"k":"m1:Access"},{"en":"Align","ua":"Вирівняти / Сумістити","ex":"To align means to position parts correctly relative to each other.","cloze":"To …… means to position parts correctly relative to each other.","acc":["align"],"dis":["Overhaul","Calibrate","Lubricate"],"uadis":["Від'єднати","Приймач попередження про опромінення","Паливна форсунка"],"k":"m1:Align"},{"en":"Bleed","ua":"П bleshoot","ua":"Шукати несправність","ex":"To troubleshoot means to identify why a system is not working.","cloze":"To …… means to identify why a system is not working.","acc":["troubleshoot"],"dis":["Fill","Withdraw","Adjust"],"uadis":["Гармата","Передня кромка","Припій / Паяти"],"k":"m1:Troubleshoot"},{"en":"Verify","ua":"Підтвердити / Перевірити","ex":"To verify means to confirm that a system is working correctly.","cloze":"To …… means to confirm that a system is working correctly.","acc":["verify"],"dis":["Blend","Activate","Secure"],"uadis":["Вирівняти / Сумістити","Підйомна сила","Знеструмити"],"k":"m1:Verify"},{"en":"Safety","ua":"Законтрити","ex":"To safety means to lock fasteners using safety wire.","cloze":"To …… means to lock fasteners using safety wire.","acc":["safety"],"dis":["Modify","Perform","Withdraw"],"uadis":["Рентгенографія","Вісь","Зворотний клапан"],"k":"m1:Safety"},{"en":"Adjust","ua":"Налаштувати","ex":"To adjust means to change settings to meet the required specification.","cloze":"To …… means to change settings to meet the required specification.","acc":["adjust"],"dis":["Inhibit","Attach","Access"],"uadis":["Візор","Паливомір","Коротке замикання"],"k":"m1:Adjust"},{"en":"Examine","ua":"Оглянути","ex":"To examine means to carefully inspect for defects or cracks.","cloze":"To …… means to carefully inspect for defects or cracks.","acc":["examine"],"dis":["Calibrate","Depressurize","Pressurize"],"uadis":["Пружинна шайба","Продути","Коротке замикання"],"k":"m1:Examine"}]},{"id":"m1:82d9d319","title":"Виконання робіт (дієслова) — ч. 3","terms":[{"en":"Annotate","ua":"Записати / Задокументувати","ex":"To annotate means to record information in a logbook.","cloze":"To …… means to record information in a logbook.","acc":["annotate"],"dis":["Fill","Overhaul","Attach"],"uadis":["Екранування","Протектор","Оновити / Замінити"],"k":"m1:Annotate"},{"en":"Activate","ua":"Активувати","ex":"To activate means to switch a system on for testing.","cloze":"To ng a warning order","ua":"Читання попереднього розпорядження","lines":[["","The company will move to the {1} at grid two three four five."],["","1 Platoon is to secure the crossing site {2} 0600 hours."],["","{3} deny the enemy freedom of movement, 2 Platoon will occupy the ridge."],["","All movement will be conducted {4} the current traffic plan."],["","3 Platoon is to be in reserve, {5} reinforce 1 Platoon on order."],["","Casualties: {6}."],["","Send a {7} every two hours to the company headquarters."]],"gaps":[{"a":"FOB","opts":["FOB","AOO","NCO","DTG"],"ua":"передова база"},{"a":"NLT","opts":["NLT","IVO","BLUF","NIL"],"ua":"не пізніше ніж"},{"a":"IOT","opts":["IOT","IAW","BPT","SOP"],"ua":"для того щоб"},{"a":"IAW","opts":["IAW","IOT","IVO","ROE"],"ua":"згідно з"},{"a":"BPT","opts":["BPT","NLT","COA","FOM"],"ua":"бути готовим"},{"a":"NIL","opts":["NIL","NCO","NLT","SOP"],"ua":"немає"},{"a":"SITREP","opts":["SITREP","DTG","COA","AOO"],"ua":"доповідь про обстановку"}]}],"drills":[{"title":"IOT / IAW / IVO / NLT","ua":"Чотири скорочення, які легко переплутати","set":["IOT","IAW","IVO","NLT"],"items":[{"s":"The platoon will occupy the hill {} observe the main road.","a":"IOT"},{"s":"All weapons will be handled {} the safety regulations.","a":"IAW"},{"s":"The vehicles were reported {} the bridge, about two hundred metres north of it.","a":"IVO"},{"s":"Submit the report {} 1800 hours.","a":"NLT"}]},{"title":"over / out / roger / wilco","ua":"Службові слова радіообміну","set":["over","out","roger","wilco"],"items":[{"s":"You have finished speaking and expect an answer, so you say {}.","a":"over"},{"s":"The conversation is finished and no answer is expected, so you say {}.","a":"out"},{"s":"You have received and understood the message, so you say {}.","a":"roger"},{"s":"You have understood the order and you will carry it out, so you say {}.","a":"wilco"}]}],"n":42}],"planned":[{"id":"m2","title":"Загальновійськова англійська","soon":true,"sub":"Military English Guide: <script>
"use strict";
var C = JSON.parse(document.getElementById("course").textContent);
/* Скрипт Telegram підвантажується і в звичайному браузері, де WebApp — заглушка
   з platform === "unknown". Довіряємо лише справжньому клієнту. */
var TGW = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
var TG = (TGW && TGW.platform && TGW.platform !== "unknown") ? TGW : null;
if(TG){ try{ TG.ready(); TG.expand(); document.body.className = "tg"; }catch(e){} }

/* ================= індекси ================= */
var IDX = {}, ALL = [], TXT = {}, DRL = {};
C.modules.forEach(function(m){
  TXT[m.id] = {}; DRL[m.id] = m.drills || [];
  (m.texts || []).forEach(function(t){ TXT[m.id][t.id] = t; });
  m.themes.forEach(function(th){
    th.mid = m.id;
    th.lessons.forEach(function(l){
      l.mid = m.id; l.tid = th.id;
      l.terms.forEach(function(t){ t.mid = m.id; IDX[t.k] = t; ALL.push(t); });
    });
  });
});

/* ================= прогрес ================= */
var DAY = Math.floor(Date.now() / 86400000);
var P = {v:2, t:{}, l:{}, streak:{d:0, c:0}};
var INTERVALS = [1, 2, 4, 8, 16, 30];

function termState(k){ return P.t[k] || (P.t[k] = {n:0, due:0}); }
function isDue(k){ var s = P.t[k]; return !s || s.due <= DAY; }
function mastered(k){ var s = P.t[k]; return !!s && s.n >= 3; }
function answer(k, good){
  var s = termState(k);
  if(good){ s.n = Math.min(s.n + 1, INTERVALS.length); s.due = DAY + INTERVALS[s.n - 1]; }
  else { s.n = 0; s.due = DAY; }
  touchStreak();
  saveSoon();
}
function touchStreak(){
  if(P.streak.d === DAY) return;
  P.streak.c = (P.streak.d === DAY - 1) ? P.streak.c + 1 : 1;
  P.streak.d = DAY;
}
function lessonState(id){ return P.l[id] || (P.l[id] = {learn:0, prac:0}); }
function lessonDone(id){ var s = P.l[id]; return !!s && s.learn && s.prac; }

/* ---- сховище: Telegram CloudStorage або localStorage ---- */
/* CloudStorage з'явився в Bot API 6.9; у старіших клієнтах виклики мовчки падають */
var CS = (TG && TG.CloudStorage && TG.isVersionAtLeast && TG.isVersionAtLeast("6.9"))
         ? TG.CloudStorage : null;
var LKEY = "course_v2";
var CHUNK = 3500, MAXCH = 24;
var syncEl = document.getElementById("f-sync");
function setSync(s){ syncEl.textContent = s; }

function loadLocal(){
  try{
    var raw = localStorage.getItem(LKEY);
    if(raw){ var o = JSON.parse(raw); if(o && o.v === 2) P = o; }
  }catch(e){}
}

function loadProgress(done){
  var fired = false;
  function once(label){
    if(fired) return;
    fired = true;
    setSync(label);
    done();
  }
  if(!CS){
    loadLocal();
    return once(TG ? "локально (старий Telegram)" : "локально");
  }
  var keys = ["cn"], i;
  for(i = 0; i < MAXCH; i++) keys.push("c" + i);
  /* якщо CloudStorage не відповість — не лишаємо порожній екран */
  setTimeout(function(){ if(!fired){ loadLocal(); once("локально"); } }, 4000);
  try{
    CS.getItems(keys, function(err, vals){
      if(!err && vals){
        var n = parseInt(vals["cn"], 10);
        if(n > 0){
          var s = "";
          for(var j = 0; j < n; j++) s += (vals["c" + j] || "");
          try{ var o = JSON.parse(s); if(o && o.v === 2) P = o; }catch(e){}
        }
      }
      if(err) loadLocal();
      once(err ? "локально" : "Telegram");
    });
  }catch(e){
    loadLocal();
    once("локально");
  }
}

var saveTimer = null;
function saveSoon(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 1200);
}
function saveNow(){
  var s = JSON.stringify(P);
  try{ localStorage.setItem(LKEY, s); }catch(e){}   /* завжди тримаємо локальну копію */
  if(!CS) return;
  var parts = [];
  for(var i = 0; i < s.length; i += CHUNK) parts.push(s.slice(i, i + CHUNK));
  if(parts.length > MAXCH){ setSync("забагато даних"); return; }
  var left = parts.length + 1;
  function fin(){ if(--left === 0) setSync("збережено"); }
  CS.setItem("cn", String(parts.length), fin);
  parts.forEach(function(p, i){ CS.setItem("c" + i, p, fin); });
}

/* ================= утиліти ================= */
function el(tag, cls, txt){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(txt !== undefined) e.textContent = txt;
  return e;
}
function shuffle(a){
  a = a.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1)), t = a[i];
    a[i] = a[j]; a[j] = t;
  }
  return a;
}
function norm(s){
  s = (s || "").toLowerCase().replace(/[.,;:!?"'’()]/g, " ")
       .replace(/[-–—/]/g, " ").replace(/\s+/g, " ").trim();
  return s.replace(/^(to|the|a|an)\s+/, "");
}
function lev(a, b){
  var m = a.length, n = b.length, i, j, prev, tmp, d = [];
  for(j = 0; j <= n; j++) d[j] = j;
  for(i = 1; i <= m; i++){
    prev = d[0]; d[0] = i;
    for(j = 1; j <= n; j++){
      tmp = d[j];
      d[j] = Math.min(d[j] + 1, d[j-1] + 1, prev + (a[i-1] === b[j-1] ? 0 : 1));
      prev = tmp;
    }
  }
  return d[n];
}
function grade(user, accepted){
  var u = norm(user), i;
  if(!u) return "";
  for(i = 0; i < accepted.length; i++) if(u === norm(accepted[i])) return "ok";
  for(i = 0; i < accepted.length; i++){
    var b = norm(accepted[i]);
    if(b.length >= 6 && lev(u, b) <= 1) return "near";
  }
  return "";
}
function speak(text, lang){
  try{
    if(!window.speechSynthesis) return;
    var u = new SpeechSynthesisUtterance(text);
    u.lang = lang || "en-GB";
    u.rate = 0.92;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }catch(e){}
}
function haptic(kind){
  try{ if(TG && TG.HapticFeedback) TG.HapticFeedback.notificationOccurred(kind); }catch(e){}
}
function pct(a, b){ return b ? Math.round(a * 100 / b) : 0; }
function progressBar(a, b){
  var w = el("div", "bar");
  var i = el("i");
  i.style.width = pct(a, b) + "%";
  w.appendChild(i);
  return w;
}
function plural(n, one, few, many){
  var m10 = n % 10, m100 = n % 100;
  if(m10 === 1 && m100 !== 11) return one;
  if(m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}

/* ================= маршрутизація ================= */
var view = document.getElementById("view");
var stack = [];
function go(fn, keep){
  if(!keep) stack.push(fn);
  view.innerHTML = "";
  fn();
  window.scrollTo(0, 0);
  if(TG && TG.BackButton){
    try{ stack.length > 1 ? TG.BackButton.show() : TG.BackButton.hide(); }catch(e){}
  }
}
function back(){
  stack.pop();
  var f = stack[stack.length - 1] || screenHome;
  go(f, true);
}
if(TG && TG.BackButton){ try{ TG.BackButton.onClick(back); }catch(e){} }
function backLink(){
  var a = el("div", "back", "← назад");
  a.onclick = back;
  return a;
}
document.getElementById("f-home").onclick = function(){ stack = []; go(screenHome); };
document.getElementById("f-review").onclick = function(){ go(screenReview); };
document.getElementById("f-search").onclick = function(){ go(screenSearch); };

/* ================= підрахунки ================= */
function moduleStats(m){
  var total = 0, done = 0, learned = 0, terms = 0;
  m.themes.forEach(function(th){
    th.lessons.forEach(function(l){
      total++;
      if(lessonDone(l.id)) done++;
      l.terms.forEach(function(t){ terms++; if(mastered(t.k)) learned++; });
    });
  });
  return {lessons:total, done:done, terms:terms, learned:learned};
}
function dueTerms(){
  return ALL.filter(function(t){
    var s = P.t[t.k];
    return s && s.n > 0 && s.due <= DAY;
  });
}

/* ---------- етап 1: картки ---------- */
function stageLearn(m, th, l){
  var queue = shuffle(l.terms.slice());
  var total = queue.length, seen = 0;
  view.appendChild(backLink());
  var head = el("div", "between");
  var counter = el("div", "sub", "");
  head.appendChild(el("h1", "", "Вивчення"));
  head.appendChild(counter);
  view.appendChild(head);
  var host = el("div");
  view.appendChild(host);

  function next(){
    host.innerHTML = "";
    counter.textContent = seen + " / " + total;
    if(!queue.length){
      lessonState(l.id).learn = 1;
      touchStreak(); saveSoon();
      var done = el("div", "card");
      done.appendChild(el("h3", "", "Картки пройдено"));
      done.appendChild(el("div", "sub", "Тепер закріплення — саме там слова переходять у активний запас."));
      var r = el("div", "row");
      var b = el("button", "act", "До закріплення");
      b.onclick = function(){ go(function(){ stagePractice(m, th, l); }, true); };
      var b2 = el("button", "ghost", "До уроку");
      b2.onclick = back;
      r.appendChild(b); r.appendChild(b2);
      done.appendChild(r);
      host.appendChild(done);
      return;
    }
    var t = queue[0];
    var c = el("div", "card");
    var f = el("div", "flash");
    f.appendChild(el("div", "big", t.en));
    var sp = el("button", "speak", "🔊 прослухати");
    sp.onclick = function(ev){ ev.stopPropagation(); speak(t.en); };
    f.appendChild(sp);
    f.appendChild(el("div", "hint", "натисніть, щоб побачити переклад"));
    c.appendChild(f);
    c.className = "card tap";
    c.onclick = function(){ flip(t, c); };
    host.appendChild(c);
  }

  function flip(t, c){
    c.innerHTML = "";
    c.className = "card";
    var f = el("div", "flash");
    f.appendChild(el("div", "big", t.en));
    f.appendChild(el("div", "mid", t.ua));
    f.appendChild(el("div", "expl", t.ex));
    var sp = el("button", "speak", "🔊 EN");
    sp.onclick = function(){ speak(t.en + ". " + t.ex); };
    f.appendChild(sp);
    c.appendChild(f);
    var r = el("div", "row");
    var ok = el("button", "act", "Знаю");
    ok.onclick = function(){
      queue.shift(); seen++;
      answer(t.k, true);
      next();
    };
    var again = el("button", "ghost", "Ще раз");
    again.onclick = function(){
      var x = queue.shift();
      queue.push(x);
      next();
    };
    r.appendChild(ok); r.appendChild(again);
    c.appendChild(r);
  }

  next();
}

/* ---------- етап 2: закріплення ---------- */
function buildItems(terms, kinds){
  var items = [];
  kinds.forEach(function(kind){
    shuffle(terms).forEach(function(t){ items.push({t:t, kind:kind}); });
  });
  return items;
}

function stagePractice(m, th, l){
  runSession(buildItems(l.terms, ["def", "ua", "cloze"]), "Закріплення",
    l.terms.length + " термінів × 3 кола", function(){
      lessonState(l.id).prac = 1;
      saveSoon();
    });
}

/* універсальна сесія питань */
function runSession(items, title, subtitle, onDone){
  view.innerHTML = "";
  view.appendChild(backLink());
  var head = el("div", "between");
  head.appendChild(el("h1", "", title));
  var counter = el("div", "sub", "");
  head.appendChild(counter);
  view.appendChild(head);
  view.appendChild(el("div", "sub", subtitle));
  var host = el("div");
  view.appendChild(host);

  var queue = items.slice(), total = items.length, done = 0, ok = 0;

  function next(){
    host.innerHTML = "";
    counter.textContent = done + " / " + total;
    if(!queue.length){
      onDone();
      var c = el("div", "card");
      c.appendChild(el("h3", "", "Готово"));
      c.appendChild(el("div", "sub", "Правильно з першого разу: " + ok + " з " + total));
      var r = el("div", "row");
      var b = el("button", "act", "Далі");
      b.onclick = back;
      r.appendChild(b);
      c.appendChild(r);
      host.appendChild(c);
      haptic("success");
      return;
    }
    var it = queue[0];
    var c = el("div", "card");
    if(it.kind === "def"){
      c.appendChild(el("div", "tiny", "Оберіть термін за означенням"));
      c.appendChild(el("div", "mid", hideTerm(it.t)));
      c.appendChild(mcq(shuffle([it.t.en].concat(it.t.dis)), it.t.en, it));
    } else if(it.kind === "ua"){
      c.appendChild(el("div", "tiny", "Як це англійською?"));
      c.appendChild(el("div", "mid", it.t.ua));
      c.appendChild(mcq(shuffle([it.t.en].concat(it.t.dis)), it.t.en, it));
    } else {
      c.appendChild(el("div", "tiny", "Впишіть пропущений термін"));
      c.appendChild(el("div", "mid", it.t.cloze.replace("……", "________")));
      c.appendChild(el("div", "hint", "укр.: " + it.t.ua));
      c.appendChild(typeIn(it));
    }
    host.appendChild(c);
  }

  function hideTerm(t){
    var re = new RegExp("\\b" + t.en.replace(/[.*+?^${}()|[\]\\\/]/g, "\\$&") + "\\b", "ig");
    return t.ex.replace(re, "________");
  }

  function resolve(it, good, node){
    answer(it.t.k, good);
    haptic(good ? "success" : "error");
    queue.shift();
    if(good){ done++; ok++; }
    else { done++; queue.push(it); total++; }
    var r = el("div", "row");
    var b = el("button", "act", "Далі");
    b.onclick = next;
    r.appendChild(b);
    if(!good) r.appendChild(el("span", "hint", "це слово повернеться в кінці"));
    node.appendChild(r);
  }

  function mcq(opts, right, it){
    var wrap = el("div", "opts");
    var used = false;
    opts.forEach(function(o){
      var b = el("button", "", o);
      b.onclick = function(){
        if(used) return;
        used = true;
        Array.prototype.forEach.call(wrap.children, function(x){
          x.disabled = true;
          if(x.textContent === right) x.className = "good";
        });
        if(o !== right) b.className = "bad";
        wrap.parentNode.appendChild(el("div", "hint", it.t.ua + " — " + it.t.ex));
        resolve(it, o === right, wrap.parentNode);
      };
      wrap.appendChild(b);
    });
    return wrap;
  }

  function typeIn(it){
    var wrap = el("div", "");
    var i = el("input", "tin");
    i.type = "text"; i.autocapitalize = "off"; i.autocomplete = "off"; i.spellcheck = false;
    i.placeholder = "англійською";
    var r = el("div", "row");
    var b = el("button", "act", "Перевірити");
    var out = el("div", "hint", "");
    var used = false;
    function check(){
      if(used) return;
      var res = grade(i.value, it.t.acc);
      i.className = "tin " + (res === "ok" ? "good" : res === "near" ? "near" : "bad");
      i.disabled = true; b.disabled = true;
      used = true;
      out.textContent = res === "ok" ? it.t.ua
        : (res === "near" ? "майже — правильно: " + it.t.en : "правильно: " + it.t.en);
      resolve(it, !!res, wrap);
    }
    b.onclick = check;
    i.onkeydown = function(e){ if(e.key === "Enter") check(); };
    r.appendChild(i); r.appendChild(b);
    wrap.appendChild(r);
    wrap.appendChild(out);
    setTimeout(function(){ try{ i.focus(); }catch(e){} }, 50);
    return wrap;
  }

  next();
}

/* ================= контекст: діалоги ================= */
function buildGapped(host, text, re, make){
  var last = 0, m;
  re.lastIndex = 0;
  while((m = re.exec(text)) !== null){
    if(m.index > last) host.appendChild(document.createTextNode(text.slice(last, m.index)));
    host.appendChild(make(m[1] ? parseInt(m[1], 10) : 0));
    last = m.index + m[0].length;
  }
  if(last < text.length) host.appendChild(document.createTextNode(text.slice(last)));
}
function accepted(g){ return g.alt ? [g.a].concat(g.alt) : [g.a]; }

function checkGaps(fields, out){
  var ok = 0;
  fields.forEach(function(x){
    var res = grade(x.f.value, accepted(x.g));
    x.f.className = "gap " + (res === "ok" ? "good" : res === "near" ? "near" : "bad");
    if(x.f.nextSibling && x.f.nextSibling.className === "fix")
      x.f.parentNode.removeChild(x.f.nextSibling);
    if(res !== "ok") x.f.parentNode.insertBefore(el("span", "fix", "→ " + x.g.a), x.f.nextSibling);
    if(res) ok++;
    if(x.key) answer(x.key, !!res);
  });
  out.innerHTML = "";
  var sc = el("div", "score", "Правильно " + ok + " з " + fields.length);
  if(ok < fields.length * 0.7) sc.className = "score low";
  out.appendChild(sc);
  haptic(ok === fields.length ? "success" : "warning");
  saveSoon();
}

function makeField(g, mode){
  if(mode === "choice"){
    var s = el("select", "gap");
    s.appendChild(el("option", "", "— обрати —")).value = "";
    shuffle(g.opts).forEach(function(o){
      var op = el("option", "", o);
      op.value = o;
      s.appendChild(op);
    });
    return s;
  }
  var i = el("input", "gap");
  i.type = "text"; i.autocapitalize = "off"; i.autocomplete = "off"; i.spellcheck = false;
  i.placeholder = g.ua || "";
  i.title = g.ua || "";
  return i;
}

function screenText(m, t, mode){
  view.appendChild(backLink());
  view.appendChild(el("h1", "", t.title));
  view.appendChild(el("div", "sub", t.ua));

  var c = el("div", "card");
  if(mode === "type"){
    c.appendChild(el("div", "hint", "Банк слів:"));
    var bank = el("div", "bank");
    shuffle(t.gaps.map(function(g){ return g.a; })).forEach(function(w){
      bank.appendChild(el("span", "", w));
    });
    c.appendChild(bank);
  }
  var fields = [];
  t.lines.forEach(function(ln){
    var row = el("div", "line");
    if(ln[0]) row.appendChild(el("div", "who", ln[0] + ":"));
    var txt = el("div", "txt");
    buildGapped(txt, ln[1], /\{(\d+)\}/g, function(idx){
      var g = t.gaps[idx - 1];
      var f = makeField(g, mode);
      fields.push({f:f, g:g, key:IDX[m.id + ":" + g.a] ? m.id + ":" + g.a : null});
      return f;
    });
    row.appendChild(txt);
    c.appendChild(row);
  });
  var out = el("div");
  var r = el("div", "row");
  var b = el("button", "act", "Перевірити");
  b.onclick = function(){ checkGaps(fields, out); };
  var b2 = el("button", "ghost", "Ще раз");
  b2.onclick = function(){ go(function(){ screenText(m, t, mode); }, true); };
  var b3 = el("button", "ghost", mode === "choice" ? "Режим: вписати" : "Режим: варіанти");
  b3.onclick = function(){
    go(function(){ screenText(m, t, mode === "choice" ? "type" : "choice"); }, true);
  };
  r.appendChild(b); r.appendChild(b2); r.appendChild(b3);
  c.appendChild(r);
  c.appendChild(out);
  view.appendChild(c);
}

function screenDrill(m, d){
  view.appendChild(backLink());
  view.appendChild(el("h1", "", d.title));
  view.appendChild(el("div", "sub", d.ua));
  var c = el("div", "card");
  var fields = [];
  d.items.forEach(function(it){
    var p = el("p", "para");
    buildGapped(p, it.s, /\{\}/g, function(){
      var s = el("select", "gap");
      s.appendChild(el("option", "", "— обрати —")).value = "";
      shuffle(d.set).forEach(function(w){
        var op = el("option", "", w);
        op.value = w;
        s.appendChild(op);
      });
      fields.push({f:s, g:{a:it.a, alt:[it.a.replace(/s$/, ""), it.a + "s"]}, key:null});
      return s;
    });
    c.appendChild(p);
  });
  var out = el("div");
  var r = el("div", "row");
  var b = el("button", "act", "Перевірити");
  b.onclick = function(){ checkGaps(fields, out); };
  r.appendChild(b);
  c.appendChild(r);
  c.appendChild(out);
  view.appendChild(c);
}

/* ================= пошук ================= */
function screenSearch(){
  view.innerHTML = "";
  view.appendChild(backLink());
  view.appendChild(el("h1", "", "Пошук по курсу"));
  var i = el("input", "tin");
  i.type = "search";
  i.placeholder = "термін англійською або українською";
  i.style.maxWidth = "100%";
  view.appendChild(i);
  var out = el("div");
  view.appendChild(out);

  function run(){
    var q = i.value.trim().toLowerCase();
    out.innerHTML = "";
    if(q.length < 2){
      out.appendChild(el("div", "hint", "Введіть щонайменше дві літери. Усього в курсі " + ALL.length + " термінів."));
      return;
    }
    var hits = ALL.filter(function(t){
      return t.en.toLowerCase().indexOf(q) >= 0 || t.ua.toLowerCase().indexOf(q) >= 0;
    }).slice(0, 40);
    if(!hits.length){ out.appendChild(el("div", "hint", "Нічого не знайдено")); return; }
    var c = el("div", "card");
    hits.forEach(function(t){
      var it = el("div", "list-item");
      var g = el("div", "grow");
      g.appendChild(el("div", "", t.en + " — " + t.ua));
      g.appendChild(el("div", "tiny", t.ex));
      it.appendChild(g);
      var sp = el("button", "speak nowrap", "🔊");
      sp.onclick = function(){ speak(t.en); };
      it.appendChild(sp);
      c.appendChild(it);
    });
    out.appendChild(c);
  }
  i.oninput = run;
  run();
  setTimeout(function(){ try{ i.focus(); }catch(e){} }, 50);
}

/* ================= старт ================= */
loadProgress(function(){ go(screenHome); });
</script>
