ition","ua":"Холості боєприпаси","ex":"Blank ammunition makes the noise of firing but sends no projectile.","cloze":"…… makes the noise of firing but sends no projectile.","acc":["blank ammunition"],"dis":["Small arms","Mortar","Round"],"uadis":["Бомботримач","Черга","Засідка"],"k":"m3:Blank ammunition","xu":"Холості боєприпаси створюють звук пострілу, але не мають кулі."},{"en":"Live ammunition","ua":"Бойові боєприпаси","ex":"Live ammunition contains a projectile and a full charge and can kill.","cloze":"…… contains a projectile and a full charge and can kill.","acc":["live ammunition"],"dis":["Rate of fire","Round","Magazine"],"uadis":["Ситуація на межі події","Сигнальник","Управління повітряним рухом"],"k":"m3:Live ammunition","xu":"Бойові боєприпаси містять кулю й повний заряд і можуть убити."},{"en":"Dud","ua":"Боєприпас, що не спрацював","ex":"A dud is a round or bomb that failed to function as designed.","cloze":"A …… is a round or bomb that failed to function as designed.","acc":["dud"],"dis":["Round","Safety catch","Calibre"],"uadis":["Розлив","Робоча смуга","Протиобліднювальна обробка"],"k":"m3:Dud","xu":"Боєприпас, що не спрацював, — це набій чи бомба, які не спрацювали як належить."}]}],"texts":[],"drills":[0]},{"id":"d577d557","title":"Авіаційне озброєння","lessons":[{"id":"m3:4f79943d","title":"Підвіска і підготовка боєприпасів","terms":[{"en":"Bomb rack","ua":"Бомботримач","ex":"A bomb rack is the unit that holds a store under the wing or fuselage.","cloze":"A …… is the unit that holds a store under the wing or fuselage.","acc":["bomb rack"],"dis":["Guided bomb","Fuze","Inert store"],"uadis":["Магазин","Відпустка","Контровочний дріт підривника"],"k":"m3:Bomb rack","xu":"Бомботримач — це вузол, що утримує підвіску під крилом чи фюзеляжем."},{"en":"Ejector release unit","ua":"Механізм скидання","ex":"An ejector release unit pushes the store clear of the aircraft when it is released.","cloze":"An …… pushes the store clear of the aircraft when it is released.","acc":["ejector release unit"],"dis":["Load crew","Arming area","Gun harmonisation"],"uadis":["Раптовість","Сигнальник","Захищене укриття для літака"],"k":"m3:Ejector release unit","xu":"Механізм скидання відштовхує підвіску від літака під час скидання."},{"en":"Arming wire","ua":"Контровочний дріт підривника","ex":"The arming wire stays with the aircraft and arms the fuze as the store falls away.","cloze":"The …… stays with the aircraft and arms the fuze as the store falls away.","acc":["arming wire"],"dis":["Hangfire","Arming area","Danger area"],"uadis":["Боєприпас, що не спрацював","Розслідування","Наземне джерело живлення"],"k":"m3:Arming wire","xu":"Контровочний дріт лишається з літаком і зводить підривник, коли підвіска відходить."},{"en":"Fuze","ua":"Підривник","ex":"The fuze makes the warhead function at the required moment.","cloze":"The …… makes the warhead function at the required moment.","acc":["fuze"],"dis":["Misfire","Ejector release unit","Guided bomb"],"uadis":["Протиобліднювальна обробка","Заправка з працюючим двигуном","Вартова служба"],"k":"m3:Fuze","xu":"Підривник змушує бойову частину спрацювати в потрібний момент."},{"en":"Guided bomb","ua":"Керована авіаційна бомба","ex":"A guided bomb is steered onto the target instead of falling freely.","cloze":"A …… is steered onto the target instead of falling freely.","acc":["guided bomb"],"dis":["Linked ammunition","Live store","Danger area"],"uadis":["Рульова доріжка","Відпустка","Служба за призовом"],"k":"m3:Guided bomb","xu":"Керована авіаційна бомба наводиться на ціль, а не падає вільно."},{"en":"Laser designator","ua":"Лазерний цілевказівник","ex":"A laser designator marks the target so that a guided weapon can follow the reflected energy.","cloze":"A …… marks the target so that a guided weapon can follow the reflected energy.","acc":["laser designator"],"dis":["Load crew","Linked ammunition","Arming area"],"uadis":["Авіаційна подія","Небезпечний чинник","Термін відрядження"],"k":"m3:Laser designator","xu":"Лазерний цілевказівник підсвічує ціль, щоб кероване озброєння йшло за відбитою енергією."},{"en":"Weapons bay","ua":"Відсік озброєння","ex":"A weapons bay carries stores inside the airframe rather than under the wing.","cloze":"A …… carries stores inside the airframe rather than under the wing.","acc":["weapons bay"],"dis":["Hung store","Live store","Danger area"],"uadis":["Дисципліна","Поріг смуги","Боєприпас, що не спрацював"],"k":"m3:Weapons bay","xu":"Відсік озброєння несе підвіски всередині планера, а не під крилом."},{"en":"Gun harmonisation","ua":"Вивірка гармати","ex":"Gun harmonisation aligns the gun so that its fire meets the aiming point at a set range.","cloze":"…… aligns the gun so that its fire meets the aiming point at a set range.","acc":["gun harmonisation"],"dis":["Guided bomb","Misfire","Arming area"],"uadis":["Засідка","Служба за призовом","Підкріплення"],"k":"m3:Gun harmonisation","xu":"Вивірка гармати наводить її так, щоб вогонь сходився з точкою прицілювання на заданій дальності."},{"en":"Linked ammunition","ua":"Боєприпаси у стрічці","ex":"Linked ammunition is joined together so that it can feed continuously into the gun.","cloze":"…… is joined together so that it can feed continuously into the gun.","acc":["linked ammunition"],"dis":["Inert store","Guided bomb","Danger area"],"uadis":["Гальмівний трос","Граната","Сигнальник"],"k":"m3:Linked ammunition","xu":"Боєприпаси у стрічці з'єднані так, щоб безперервно подаватися в гармату."},{"en":"Inert store","ua":"Навчальний (інертний) боєприпас","ex":"An inert store contains no explosive and is used for training and loading practice.","cloze":"An …… contains no explosive and is used for training and loading practice.","acc":["inert store"],"dis":["Linked ammunition","Danger area","Fuze"],"uadis":["Сигнальник","Буксирувати","Блокування вимкненого стану"],"k":"m3:Inert store","xu":"Навчальний боєприпас не містить вибухівки й слугує для тренування підвіски."},{"en":"Live store","ua":"Бойовий боєприпас","ex":"A live store contains its full explosive charge and is treated as dangerous at all times.","cloze":"A …… contains its full explosive charge and is treated as dangerous at all times.","acc":["live store"],"dis":["Load crew","Misfire","Explosive ordnance disposal"],"uadis":["Вступити на службу","Сповіщення для екіпажів","Термін відрядження"],"k":"m3:Live store","xu":"Бойовий боєприпас містить повний заряд вибухівки й завжди вважається небезпечним."},{"en":"Hung store","ua":"Боєприпас, що не зійшов","ex":"A hung store failed to release and stays on the rack after the pilot selected it.","cloze":"A …… failed to release and stays on the rack after the pilot selected it.","acc":["hung store"],"dis":["Load crew","Fuze","Inert store"],"uadis":["Інцидент","Розгортання, відрядження в район дій","Робоча смуга"],"k":"m3:Hung store","xu":"Боєприпас, що не зійшов, не відділився й лишився на тримачі після команди пілота."},{"en":"Misfire","ua":"Осічка","ex":"A misfire is a round that did not fire when the trigger was pressed.","cloze":"A …… is a round that did not fire when the trigger was pressed.","acc":["misfire"],"dis":["Ejector release unit","Hung store","Arming area"],"uadis":["Контровочний дріт підривника","Сповіщення для екіпажів","Гальмівний гак"],"k":"m3:Misfire","xu":"Осічка — це набій, який не вистрілив при натисканні спускового гачка."},{"en":"Hangfire","ua":"Затримка пострілу","ex":"A hangfire is a delay between the trigger being pressed and the round firing, so the gun stays dangerous.","cloze":"A …… is a delay between the trigger being pressed and the round firing, so the gun stays dangerous.","acc":["hangfire"],"dis":["Linked ammunition","Load crew","Laser designator"],"uadis":["Оточення району, оцеплення","Ставити завдання, інструктувати","Наступальна операція"],"k":"m3:Hangfire","xu":"Затримка пострілу — це запізнення пострілу після натискання гачка, тож гармата лишається небезпечною."},{"en":"Arming area","ua":"Майданчик спорядження","ex":"The arming area is the marked place where weapons are made live before flight.","cloze":"The …… is the marked place where weapons are made live before flight.","acc":["arming area"],"dis":["Misfire","Guided bomb","Arming wire"],"uadis":["Підривник","Розосереджена стоянка","Затримка пострілу"],"k":"m3:Arming area","xu":"Майданчик спорядження — це позначене місце, де зброю приводять у бойовий стан перед польотом."},{"en":"Danger area","ua":"Небезпечна зона","ex":"The danger area is the space around an armed aircraft that personnel must keep clear of.","cloze":"The …… is the space around an armed aircraft that personnel must keep clear of.","acc":["danger area"],"dis":["Guided bomb","Hung store","Live store"],"uadis":["Перекличка","Казарма","Дозвіл диспетчера"],"k":"m3:Danger area","xu":"Небезпечна зона — це простір навколо озброєного літака, від якого персонал має триматися подалі."},{"en":"Explosive ordnance disposal","ua":"Знешкодження вибухонебезпечних предметів","ex":"Explosive ordnance disposal is the work of making unexploded items safe.","cloze":"…… is the work of making unexploded items safe.","acc":["explosive ordnance disposal"],"dis":["Fuze","Hangfire","Misfire"],"uadis":["Вартова служба","Бойовий боєприпас","Захищене укриття для літака"],"k":"m3:Explosive ordnance disposal","xu":"Знешкодження вибухонебезпечних предметів — це роботи з приведення нерозірваних предметів у безпечний стан."},{"en":"Load crew","ua":"Розрахунок підвіски","ex":"The load crew is the team that fits and checks the stores on the aircraft.","cloze":"The …… is the team that fits and checks the stores on the aircraft.","acc":["load crew"],"dis":["Arming area","Ejector release unit","Linked ammunition"],"uadis":["Авіаційна подія","Заправка з працюючим двигуном","Гальмівний парашут"],"k":"m3:Load crew","xu":"Розрахунок підвіски — це група, що встановлює й перевіряє підвіски на літаку."}]}],"texts":["arming"],"drills":[1]},{"id":"28571ad2","title":"Наземне обслуговування","lessons":[{"id":"m3:00e96184","title":"Підготовка і випуск літака","terms":[{"en":"Marshalling","ua":"Зустріч і супровід сигналами","ex":"Marshalling is guiding an aircraft on the ground using hand or wand signals.","cloze":"…… is guiding an aircraft on the ground using hand or wand signals.","acc":["marshalling"],"dis":["Brake chute","Tow","Picketing"],"uadis":["Механізм скидання","Розосереджена стоянка","Казарма"],"k":"m3:Marshalling","xu":"Зустріч і супровід сигналами — це керування літаком на землі за допомогою жестів чи жезлів."},{"en":"Marshaller","ua":"Сигнальник","ex":"The marshaller stands where the pilot can see him and gives the movement signals.","cloze":"The …… stands where the pilot can see him and gives the movement signals.","acc":["marshaller"],"dis":["Turnaround","Picketing","Run-up"],"uadis":["Контровочний дріт підривника","Пункт збору","Підривник"],"k":"m3:Marshaller","xu":"Сигнальник стоїть там, де пілот його бачить, і подає сигнали руху."},{"en":"Signal wands","ua":"Сигнальні жезли","ex":"Signal wands are lighted batons used for marshalling at night.","cloze":"…… are lighted batons used for marshalling at night.","acc":["signal wands"],"dis":["Tow","Ground power unit","Taxi"],"uadis":["Блокування вимкненого стану","Вивірка гармати","Оперативне обслуговування"],"k":"m3:Signal wands","xu":"Сигнальні жезли — це підсвічені палиці для супроводу вночі."},{"en":"Taxi","ua":"Рулити","ex":"To taxi means to move the aircraft along the ground under its own power.","cloze":"To …… means to move the aircraft along the ground under its own power.","acc":["taxi"],"dis":["Picketing","FOD walk","Signal wands"],"uadis":["Ситуація на межі події","Гальмівний гак","Розрахунок підвіски"],"k":"m3:Taxi","xu":"Рулити означає рухати літак по землі за рахунок власної тяги."},{"en":"Tow","ua":"Буксирувати","ex":"To tow means to move the aircraft with a tug and a tow bar.","cloze":"To …… means to move the aircraft with a tug and a tow bar.","acc":["tow"],"dis":["Hot refuelling","FOD walk","Run-up"],"uadis":["Прохід із збором сторонніх предметів","Гальмівний трос","Бомботримач"],"k":"m3:Tow","xu":"Буксирувати означає рухати літак тягачем із водилом."},{"en":"Picketing","ua":"Швартування літака","ex":"Picketing ties the aircraft down so that wind cannot move or damage it.","cloze":"…… ties the aircraft down so that wind cannot move or damage it.","acc":["picketing"],"dis":["De-icing","Servicing","Replenishment"],"uadis":["Авіаційна подія","Дисципліна","Боєприпас, що не спрацював"],"k":"m3:Picketing","xu":"Швартування літака закріплює його на землі, щоб вітер не зрушив і не пошкодив."},{"en":"Ground power unit","ua":"Наземне джерело живлення","ex":"A ground power unit supplies electrical power while the engine is not running.","cloze":"A …… supplies electrical power while the engine is not running.","acc":["ground power unit"],"dis":["Signal wands","Tow","Picketing"],"uadis":["Розлив","Оперативне обслуговування","Диспетчерська вежа"],"k":"m3:Ground power unit","xu":"Наземне джерело живлення подає електроенергію, поки двигун не працює."},{"en":"Turnaround","ua":"Підготовка до повторного вильоту","ex":"A turnaround is the servicing done between two sorties to make the aircraft ready again.","cloze":"A …… is the servicing done between two sorties to make the aircraft ready again.","acc":["turnaround"],"dis":["Brake chute","Run-up","Walk-around"],"uadis":["Майданчик спорядження","Черговий офіцер","Калібр"],"k":"m3:Turnaround","xu":"Підготовка до повторного вильоту — це обслуговування між двома вильотами, щоб знову підготувати літак."},{"en":"Servicing","ua":"Оперативне обслуговування","ex":"Servicing covers refuelling, replenishment and the checks done before flight.","cloze":"…… covers refuelling, replenishment and the checks done before flight.","acc":["servicing"],"dis":["Picketing","FOD walk","Signal wands"],"uadis":["Прорив","Прохід із збором сторонніх предметів","Оточення району, оцеплення"],"k":"m3:Servicing","xu":"Оперативне обслуговування охоплює заправку, поповнення й передпольотні перевірки."},{"en":"Replenishment","ua":"Поповнення робочих рідин","ex":"Replenishment tops up oil, hydraulic fluid, oxygen and other consumables.","cloze":"…… tops up oil, hydraulic fluid, oxygen and other consumables.","acc":["replenishment"],"dis":["Ground power unit","FOD walk","Engine run"],"uadis":["Постріл, патрон","Магазин","Відпустка"],"k":"m3:Replenishment","xu":"Поповнення робочих рідин доливає оливу, гідрорідину, кисень та інші витратні матеріали."},{"en":"Engine run","ua":"Гонка двигуна","ex":"An engine run is a ground test in which the engine is operated to check its condition.","cloze":"An …… is a ground test in which the engine is operated to check its condition.","acc":["engine run"],"dis":["Signal wands","Brake chute","Servicing"],"uadis":["Гальмівний парашут","Дисципліна","Перон, стоянка"],"k":"m3:Engine run","xu":"Гонка двигуна — це наземна перевірка, під час якої двигун працює для оцінки стану."},{"en":"Run-up","ua":"Вивід на режим","ex":"During the run-up the engine is taken to high power while the aircraft is held on the brakes.","cloze":"During the …… the engine is taken to high power while the aircraft is held on the brakes.","acc":["run-up"],"dis":["Replenishment","Marshalling","Brake chute"],"uadis":["Гарнізон","Механізм скидання","Стройова підготовка"],"k":"m3:Run-up","xu":"Під час виводу на режим двигун виводять на високу тягу, тримаючи літак на гальмах."},{"en":"De-icing","ua":"Протиобліднювальна обробка","ex":"De-icing removes ice and snow from the airframe before flight.","cloze":"…… removes ice and snow from the airframe before flight.","acc":["de-icing"],"dis":["Engine run","Hot refuelling","Taxi"],"uadis":["Підготовка до повторного вильоту","Заборонений до польотів","Вивірка гармати"],"k":"m3:De-icing","xu":"Протиобліднювальна обробка видаляє лід і сніг із планера перед польотом."},{"en":"Walk-around","ua":"Зовнішній огляд","ex":"The walk-around is the visual inspection of the aircraft carried out before every flight.","cloze":"The …… is the visual inspection of the aircraft carried out before every flight.","acc":["walk-around"],"dis":["Arrestor hook","Brake chute","Picketing"],"uadis":["Евакуація","Аварійна ситуація","Вогні наближення"],"k":"m3:Walk-around","xu":"Зовнішній огляд — це візуальна перевірка літака перед кожним польотом."},{"en":"FOD walk","ua":"Прохід із збором сторонніх предметів","ex":"A FOD walk is a line of personnel walking the ramp to pick up loose objects.","cloze":"A …… is a line of personnel walking the ramp to pick up loose objects.","acc":["fod walk"],"dis":["Marshaller","Arrestor hook","Brake chute"],"uadis":["Наряд-допуск","Аварійна ситуація","Поріг смуги"],"k":"m3:FOD walk","xu":"Прохід зі збором сторонніх предметів — це шеренга людей, що йде стоянкою й підбирає сміття."},{"en":"Hot refuelling","ua":"Заправка з працюючим двигуном","ex":"Hot refuelling puts fuel into the aircraft while the engine is still running.","cloze":"…… puts fuel into the aircraft while the engine is still running.","acc":["hot refuelling"],"dis":["Walk-around","Brake chute","Marshaller"],"uadis":["Введення в оману","Майданчик спорядження","Дійсна дальність"],"k":"m3:Hot refuelling","xu":"Заправка з працюючим двигуном подає паливо в літак, поки двигун ще працює."},{"en":"Brake chute","ua":"Гальмівний парашут","ex":"The brake chute is streamed after landing to shorten the landing run.","cloze":"The …… is streamed after landing to shorten the landing run.","acc":["brake chute"],"dis":["Marshalling","Tow","Turnaround"],"uadis":["Протиобліднювальна обробка","Бойове зіткнення","Розслідування"],"k":"m3:Brake chute","xu":"Гальмівний парашут випускають після посадки, щоб скоротити пробіг."},{"en":"Arrestor hook","ua":"Гальмівний гак","ex":"The arrestor hook catches the cable on the runway to stop the aircraft quickly.","cloze":"The …… catches the cable on the runway to stop the aircraft quickly.","acc":["arrestor hook"],"dis":["Tow","Marshaller","Picketing"],"uadis":["Механізм скидання","Боєприпас, що не зійшов","Наліт, рейд"],"k":"m3:Arrestor hook","xu":"Гальмівний гак чіпляє трос на смузі, щоб швидко зупинити літак."}]}],"texts":["launch"],"drills":[3]},{"id":"026235b3","title":"Аеродромна служба","lessons":[{"id":"m3:e785e983","title":"Аеродром і рух по ньому","terms":[{"en":"Runway","ua":"Злітно-посадкова смуга","ex":"The runway is the prepared strip used for take-off and landing.","cloze":"The …… is the prepared strip used for take-off and landing.","acc":["runway"],"dis":["Threshold","Windsock","Taxiway"],"uadis":["Диспетчерська вежа","Евакуація поранених","Граната"],"k":"m3:Runway","xu":"Злітно-посадкова смуга — це підготовлена смуга для зльоту й посадки."},{"en":"Taxiway","ua":"Рульова доріжка","ex":"A taxiway connects the runway with the aprons and shelters.","cloze":"A …… connects the runway with the aprons and shelters.","acc":["taxiway"],"dis":["Threshold","Windsock","Runway"],"uadis":["Темп стрільби","Гальмівний парашут","Буксирувати"],"k":"m3:Taxiway","xu":"Рульова доріжка з'єднує смугу зі стоянками й укриттями."},{"en":"Apron","ua":"Перон, стоянка","ex":"The apron is the paved area where aircraft are parked and serviced.","cloze":"The …… is the paved area where aircraft are parked and serviced.","acc":["apron"],"dis":["Taxiway","Crash crew","Arrestor cable"],"uadis":["Небезпечна речовина","Відновлення аеродрому","Темп стрільби"],"k":"m3:Apron","xu":"Перон — це майданчик із твердим покриттям, де літаки стоять і обслуговуються."},{"en":"Dispersal","ua":"Розосереджена стоянка","ex":"A dispersal is a parking area away from the main apron, used to reduce losses from attack.","cloze":"A …… is a parking area away from the main apron, used to reduce losses from attack.","acc":["dispersal"],"dis":["Crash crew","Threshold","Runway"],"uadis":["Стройова підготовка","Небезпечний чинник","Темп стрільби"],"k":"m3:Dispersal","xu":"Розосереджена стоянка — це майданчик віддалік від головного перону для зменшення втрат від удару."},{"en":"Hardened aircraft shelter","ua":"Захищене укриття для літака","ex":"A hardened aircraft shelter protects the aircraft from attack while it is on the ground.","cloze":"A …… protects the aircraft from attack while it is on the ground.","acc":["hardened aircraft shelter"],"dis":["Arrestor cable","Active runway","Airfield damage repair"],"uadis":["Стрілецька зброя","Служба за призовом","Темп стрільби"],"k":"m3:Hardened aircraft shelter","xu":"Захищене укриття для літака оберігає його від нападу, поки він на землі."},{"en":"Hangar","ua":"Ангар","ex":"A hangar is the building in which aircraft are kept and maintained.","cloze":"A …… is the building in which aircraft are kept and maintained.","acc":["hangar"],"dis":["Windsock","Arrestor cable","Clearance"],"uadis":["Гарнізон","Міномет","Евакуація"],"k":"m3:Hangar","xu":"Ангар — це будівля, у якій зберігають і обслуговують літаки."},{"en":"Control tower","ua":"Диспетчерська вежа","ex":"The control tower is the building from which air traffic control watches and directs movement.","cloze":"The …… is the building from which air traffic control watches and directs movement.","acc":["control tower"],"dis":["Threshold","Dispersal","Active runway"],"uadis":["Швартування літака","Підготовка до повторного вильоту","Засідка"],"k":"m3:Control tower","xu":"Диспетчерська вежа — це будівля, з якої керують рухом на аеродромі."},{"en":"Air traffic control","ua":"Управління повітряним рухом","ex":"Air traffic control keeps aircraft separated in the air and on the ground.","cloze":"…… keeps aircraft separated in the air and on the ground.","acc":["air traffic control"],"dis":["Dispersal","Crash crew","Holding point"],"uadis":["Кулемет","Ангар","Небезпечний чинник"],"k":"m3:Air traffic control","xu":"Управління повітряним рухом розводить літаки в повітрі й на землі."},{"en":"Clearance","ua":"Дозвіл диспетчера","ex":"A clearance is the permission given by air traffic control to carry out a movement.","cloze":"A …… is the permission given by air traffic control to carry out a movement.","acc":["clearance"],"dis":["Arrestor cable","Apron","Dispersal"],"uadis":["Перон, стоянка","Боєприпаси у стрічці","Калібр"],"k":"m3:Clearance","xu":"Дозвіл диспетчера — це дозвіл на виконання руху, наданий службою управління рухом."},{"en":"Holding point","ua":"Місце очікування","ex":"At the holding point the aircraft waits until it is cleared to enter the runway.","cloze":"At the …… the aircraft waits until it is cleared to enter the runway.","acc":["holding point"],"dis":["Control tower","Apron","Airfield damage repair"],"uadis":["Протиобліднювальна обробка","Дозор, патруль","Підкріплення"],"k":"m3:Holding point","xu":"На місці очікування літак чекає, поки йому дозволять вийти на смугу."},{"en":"Threshold","ua":"Поріг смуги","ex":"The threshold is the beginning of the part of the runway that may be used for landing.","cloze":"The …… is the beginning of the part of the runway that may be used for landing.","acc":["threshold"],"dis":["Apron","Taxiway","Dispersal"],"uadis":["Відпустка","Дійсна дальність","Введення в оману"],"k":"m3:Threshold","xu":"Поріг смуги — це початок тієї частини смуги, яку можна використовувати для посадки."},{"en":"Active runway","ua":"Робоча смуга","ex":"The active runway is the one in use for take-off and landing at that time.","cloze":"The …… is the one in use for take-off and landing at that time.","acc":["active runway"],"dis":["Approach lights","Windsock","Runway"],"uadis":["Кулемет","Безпека польотів","Зустріч і супровід сигналами"],"k":"m3:Active runway","xu":"Робоча смуга — це та, що на цей час використовується для зльоту й посадки."},{"en":"Approach lights","ua":"Вогні наближення","ex":"Approach lights guide the pilot to the runway in poor visibility.","cloze":"…… guide the pilot to the runway in poor visibility.","acc":["approach lights"],"dis":["Hangar","Taxiway","Threshold"],"uadis":["Дисципліна","Бойовий боєприпас","Підготовка до повторного вильоту"],"k":"m3:Approach l  of it until I say so."],["B","Understood. Are these stores {2} or inert?"],["A","Live. Treat every one of them as dangerous, even on the trolley."],["B","The store is on the {3} and locked. Both lugs are engaged."],["A","Good. Now connect the {4} — it must stay with the aircraft when the store falls away."],["B","Done. And the {5} is set for the delay given in the tasking."],["A","Check the {6} area behind the aircraft as well; the exhaust is dangerous during the engine run."],["B","Clear. What do we do if a store does not release in flight?"],["A","Then it is a {7}. The aircraft lands with it, and nobody approaches until the {8} team has looked at it."]],"gaps":[{"a":"arming area","opts":["arming area","dispersal","holding point","assembly point"],"ua":"майданчик спорядження"},{"a":"live","opts":["live","inert","blank","linked"],"ua":"бойові"},{"a":"bomb rack","opts":["bomb rack","weapons bay","launcher","pylon"],"ua":"бомботримач"},{"a":"arming wire","opts":["arming wire","safety wire","linked ammunition","lockout"],"ua":"контровочний дріт підривника"},{"a":"fuze","opts":["fuze","sight","seeker","primer"],"ua":"підривник"},{"a":"danger","opts":["danger","arming","assembly","dispersal"],"ua":"небезпечна зона"},{"a":"hung store","opts":["hung store","misfire","dud","hangfire"],"ua":"боєприпас, що не зійшов"},{"a":"EOD","alt":["explosive ordnance disposal"],"opts":["EOD","ATC","GPU","FOD"],"ua":"знешкодження боєприпасів"}]},{"id":"launch","title":"Launching the aircraft","ua":"Випуск літака","lines":[["A","Before start, connect the {1} — we are not using the internal battery for this."],["B","Connected. The {2} is complete: no leaks, no loose panels, covers removed."],["A","Good. The team has finished the {3}, so the ramp is clear of loose objects."],["B","Ready for engine start. Who takes the aircraft out?"],["A","I will {4} him out to the taxiway. Watch my wands and repeat nothing the pilot cannot see."],["B","Understood. He will {5} to the holding point and wait  in the background is {}.","a":"CBIT"},{"s":"The self-test the technician starts by hand is {}.","a":"IBIT"}]},{"title":"MHP / AHP / EHP","ua":"Три гідронасоси","set":["MHP","AHP","EHP"],"items":[{"s":"Under normal conditions the system is fed by the {}.","a":"MHP"},{"s":"If the main pump fails, pressure is kept by the {}.","a":"AHP"},{"s":"If both fail, the {} gives enough pressure for the essentials.","a":"EHP"}]},{"title":"HUD / HMD / HSI","ua":"Три засоби індикації","set":["HUD","HMD","HSI"],"items":[{"s":"The symbols projected onto the glass in front of the pilot appear on the {}.","a":"HUD"},{"s":"The display built into the pilot's helmet is the {}.","a":"HMD"},{"s":"The instrument that combines heading and navigation is the {}.","a":"HSI"}]},{"title":"MLG / NLG / NWS","ua":"Шасі й керування ним","set":["MLG","NLG","NWS"],"items":[{"s":"The wheels under the centre of the aircraft are the {}.","a":"MLG"},{"s":"The wheel under the nose is the {}.","a":"NLG"},{"s":"The system that turns the nose wheel for taxiing is {}.","a":"NWS"}]},{"title":"LRU / SRU","ua":"Де змінюють блок","set":["LRU","SRU"],"items":[{"s":"A unit that can be changed on the flight line is a {}.","a":"LRU"},{"s":"A unit that can be changed only in the workshop is a {}.","a":"SRU"}]},{"title":"ECM / ECCM / RWR","ua":"Радіоелектронна боротьба","set":["ECM","ECCM","RWR"],"items":[{"s":"Jamming and deceiving the enemy's radar is {}.","a":"ECM"},{"s":"Protecting our own radar against that jamming is {}.","a":"ECCM"},{"s":"The receiver that warns the pilot he is being illuminated is the {}.","a":"RWR"}]}],"n":378}],"planned":[]}</script>
<script>
"use strict";
var C = JSON.parse(document.getElementById("course").textContent);
/* Скрипт Telegram підвантажується і в звичайному браузері, де WebApp — заглушка
   з platform === "unknown". Довіряємо лише справжньому клієнту. */
var TGW = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
var TG = (TGW && TGW.platform && TGW.platform !== "unknown") ? TGW : null;
function applyTheme(){
  if(!TG) return;
  /* світлу чи темну палітру диктує Telegram, а не системна тема ОС:
     інакше рамки й кольори відповідей беруться з однієї теми, а фон з іншої */
  document.documentElement.setAttribute("data-theme",
    TG.colorScheme === "light" ? "light" : "dark");
}
if(TG){
  try{
    TG.ready(); TG.expand();
    document.body.className = "tg";
    applyTheme();
    if(TG.onEvent) TG.onEvent("themeChanged", applyTheme);
  }catch(e){}
}

/* ================= індекси ================= */
var IDX = {}, ALL = [], TXT = {}, DRL = {};
C.modules.forEach(function(m){
  TXT[m.id] = {}; DRL[m.id] = m.drills || [];
  (m.texts || []).forEach(function(t){ TXT[m.id][t.id] = t; });
  m.themes.forEach(function(th){
    th.mid = m.id;
    th.lessons.forEach(function(l){
      l.mid = m.id; l.tid = th.id;
      l.terms.forEach(function(t){ t.mid = m.id; IDX[t.k] = t; ALL.push(t); });
    });
  });
});

/* ================= прогрес ================= */
var DAY = Math.floor(Date.now() / 86400000);
var P = {v:2, t:{}, l:{}, streak:{d:0, c:0}};
var INTERVALS = [1, 2, 4, 8, 16, 30];
var DEFAULT_GOAL = 15;

/* привести старий прогрес до поточної схеми (додані поля r, w, today, goal, last) */
function normalizeProgress(){
  if(!P.today || P.today.d !== DAY) P.today = {d:DAY, learned:0};
  if(typeof P.goal !== "number") P.goal = DEFAULT_GOAL;
  if(!P.last) P.last = null;
  if(!P.c) P.c = {};
  for(var k in P.t){
    var s = P.t[k];
    if(s.w === undefined) s.w = 0;
    /* грандфазер: раніше засвоєні слова (n>=3) зараховуємо як відтворені, щоб не втратити прогрес */
    if(s.r === undefined) s.r = (s.n >= 3) ? 1 : 0;
  }
}

function termState(k){ return P.t[k] || (P.t[k] = {n:0, due:0, r:0, w:0}); }
function isDue(k){ var s = P.t[k]; return !s || s.due <= DAY; }
/* засвоєно = достатньо повторень І хоча б одне відтворення з голови (не лише впізнавання) */
function mastered(k){ var s = P.t[k]; return !!s && s.n >= 3 && s.r >= 1; }
function seen(k){ return !!P.t[k]; }

function answer(k, good, recall){
  var s = termState(k);
  var wasNew = (s.n === 0 && s.r === 0 && s.w === 0);
  if(good){
    if(s.n === 0) countLearnedToday();
    s.n = Math.min(s.n + 1, INTERVALS.length);
    s.due = DAY + INTERVALS[s.n - 1];
    if(recall) s.r = (s.r || 0) + 1;   /* відтворення з голови рахуємо окремо */
  } else {
    s.n = 0; s.due = DAY; s.w = (s.w || 0) + 1;
  }
  touchStreak();
  saveSoon();
}
function markKnown(k){          /* «вже знаю» — одразу засвоєно */
  var s = termState(k);
  if(s.n === 0) countLearnedToday();
  s.n = INTERVALS.length; s.r = Math.max(s.r || 0, 1);
  s.due = DAY + INTERVALS[INTERVALS.length - 1];
  saveSoon();
}
function countLearnedToday(){
  if(P.today.d !== DAY) P.today = {d:DAY, learned:0};
  P.today.learned++;
}
function touchStreak(){
  if(P.streak.d === DAY) return;
  P.streak.c = (P.streak.d === DAY - 1) ? P.streak.c + 1 : 1;
  P.streak.d = DAY;
}
function weakTerms(){
  return ALL.filter(function(t){ var s = P.t[t.k]; return s && s.w > 0 && !mastered(t.k); })
    .sort(function(a, b){ return (P.t[b.k].w) - (P.t[a.k].w); });
}
function rememberLast(m, th, l){ P.last = {mid:m.id, thid:th.id, lid:l.id, lt:l.title, tt:th.title}; saveSoon(); }
function lessonState(id){ return P.l[id] || (P.l[id] = {learn:0, prac:0}); }
function lessonDone(id){ var s = P.l[id]; return !!s && s.learn && s.prac; }

/* ---- контекст: діалоги й дрилі теми ---- */
function ctxKey(mid, kind, id){ return "x:" + mid + ":" + kind + ":" + id; }
function ctxDone(key){ return !!(P.c && P.c[key]); }
function markCtx(key){ if(!P.c) P.c = {}; P.c[key] = 1; }
function themeCtxDone(m, th){
  var any = false, all = true;
  th.texts.forEach(function(tid){ any = true; if(!ctxDone(ctxKey(m.id, "t", tid))) all = false; });
  th.drills.forEach(function(di){ any = true; if(!ctxDone(ctxKey(m.id, "d", di))) all = false; });
  return any && all;
}

/* ---- сховище: Telegram CloudStorage або localStorage ---- */
/* CloudStorage з'явився в Bot API 6.9; у старіших клієнтах виклики мовчки падають */
var CS = (TG && TG.CloudStorage && TG.isVersionAtLeast && TG.isVersionAtLeast("6.9"))
         ? TG.CloudStorage : null;
var LKEY = "course_v2";
var CHUNK = 3500, MAXCH = 24;
var syncEl = document.getElementById("f-sync");
function setSync(s){ syncEl.textContent = s; }

function loadLocal(){
  try{
    var raw = localStorage.getItem(LKEY);
    if(raw){ var o = JSON.parse(raw); if(o && o.v === 2) P = o; }
  }catch(e){}
}

function loadProgress(done){
  var fired = false;
  function once(label){
    if(fired) return;
    fired = true;
    normalizeProgress();
    setSync(label);
    done();
  }
  if(!CS){
    loadLocal();
    return once(TG ? "локально (старий Telegram)" : "локально");
  }
  var keys = ["cn"], i;
  for(i = 0; i < MAXCH; i++) keys.push("c" + i);
  /* якщо CloudStorage не відповість — не лишаємо порожній екран */
  setTimeout(function(){ if(!fired){ loadLocal(); once("локально"); } }, 4000);
  try{
    CS.getItems(keys, function(err, vals){
      if(!err && vals){
        var n = parseInt(vals["cn"], 10);
        if(n > 0){
          var s = "";
          for(var j = 0; j < n; j++) s += (vals["c" + j] || "");
          try{ var o = JSON.parse(s); if(o && o.v === 2) P = o; }catch(e){}
        }
      }
      if(err) loadLocal();
      once(err ? "локально" : "Telegram");
    });
  }catch(e){
    loadLocal();
    once("локально");
  }
}

var saveTimer = null;
function saveSoon(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 1200);
}
function saveNow(){
  var s = JSON.stringify(P);
  try{ localStorage.setItem(LKEY, s); }catch(e){}   /* завжди тримаємо локальну копію */
  if(!CS) return;
  var parts = [];
  for(var i = 0; i < s.length; i += CHUNK) parts.push(s.slice(i, i + CHUNK));
  if(parts.length > MAXCH){ setSync("забагато даних"); return; }
  var left = parts.length + 1;
  function fin(){ if(--left === 0) setSync("збережено"); }
  CS.setItem("cn", String(parts.length), fin);
  parts.forEach(function(p, i){ CS.setItem("c" + i, p, fin); });
}

/* ================= утиліти ================= */
function el(tag, cls, txt){
  var e = document.createElement(tag);
  if(cls) e.className = cls;
  if(txt !== undefined) e.textContent = txt;
  return e;
}
function shuffle(a){
  a = a.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1)), t = a[i];
    a[i] = a[j]; a[j] = t;
  }
  return a;
}
function norm(s){
  s = (s || "").toLowerCase().replace(/[.,;:!?"'’()]/g, " ")
       .replace(/[-–—/]/g, " ").replace(/\s+/g, " ").trim();
  return s.replace(/^(to|the|a|an)\s+/, "");
}
function lev(a, b){
  var m = a.length, n = b.length, i, j, prev, tmp, d = [];
  for(j = 0; j <= n; j++) d[j] = j;
  for(i = 1; i <= m; i++){
    prev = d[0]; d[0] = i;
    for(j = 1; j <= n; j++){
      tmp = d[j];
      d[j] = Math.min(d[j] + 1, d[j-1] + 1, prev + (a[i-1] === b[j-1] ? 0 : 1));
      prev = tmp;
    }
  }
  return d[n];
}
function grade(user, accepted){
  var u = norm(user), i;
  if(!u) return "";
  for(i = 0; i < accepted.length; i++) if(u === norm(accepted[i])) return "ok";
  for(i = 0; i < accepted.length; i++){
    var b = norm(accepted[i]);
    if(b.length >= 6 && lev(u, b) <= 1) return "near";
  }
  return "";
}
function speak(text, lang){
  try{
    if(!window.speechSynthesis) return;
    var u = new SpeechSynthesisUtterance(text);
    u.lang = lang || "en-GB";
    u.rate = 0.92;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }catch(e){}
}
function haptic(kind){
  try{ if(TG && TG.HapticFeedback) TG.HapticFeedback.notificationOccurred(kind); }catch(e){}
}
function pct(a, b){ return b ? Math.round(a * 100 / b) : 0; }
function progressBar(a, b){
  var w = el("div", "bar");
  var i = el("i");
  i.style.width = pct(a, b) + "%";
  w.appendChild(i);
  return w;
}
/* кільце денної цілі (SVG) */
function goalRing(done, goal){
  var r = 26, cir = 2 * Math.PI * r, p = Math.min(1, goal ? done / goal : 0);
  var svg = "<svg width='64' height='64' viewBox='0 0 64 64'>"
    + "<circle cx='32' cy='32' r='" + r + "' fill='none' stroke='var(--line)' stroke-width='6'/>"
    + "<circle cx='32' cy='32' r='" + r + "' fill='none' stroke='var(--accent)' stroke-width='6'"
    + " stroke-linecap='round' stroke-dasharray='" + cir + "' stroke-dashoffset='" + (cir * (1 - p))
    + "' transform='rotate(-90 32 32)'/>"
    + "<text x='32' y='37' text-anchor='middle' font-size='16' fill='var(--fg)'>" + done + "</text></svg>";
  var d = el("div");
  d.innerHTML = svg;
  return d.firstChild;
}
/* статeless-клавіатура: цифри — варіант, Enter — далі/перевірити, пробіл — перевернути картку */
document.addEventListener("keydown", function(e){
  var tag = (e.target && e.target.tagName) || "";
  if(e.key >= "1" && e.key <= "9"){
    var opts = document.querySelectorAll("#view .opts button:not([disabled])");
    if(opts.length){
      var b = opts[parseInt(e.key, 10) - 1];
      if(b){ e.preventDefault(); b.click(); }
      return;
    }
    if(e.key === "1" && qButton("Знаю")){ e.preventDefault(); qButton("Знаю").click(); }
    else if(e.key === "2" && qButton("Ще раз")){ e.preventDefault(); qButton("Ще раз").click(); }
    return;
  }
  if(e.key === "ArrowRight" && qButton("Знаю")){ e.preventDefault(); qButton("Знаю").click(); return; }
  if(e.key === "ArrowLeft" && qButton("Ще раз")){ e.preventDefault(); qButton("Ще раз").click(); return; }
  if(e.key === "Enter"){
    var nx = qButton("Далі");
    if(nx){ e.preventDefault(); nx.click(); return; }
  }
  if(e.key === " " && tag !== "INPUT" && tag !== "TEXTAREA"){
    var flip = document.querySelector("#view .card.tap");
    if(flip){ e.preventDefault(); flip.click(); }
    else if(qButton("Знаю")){ e.preventDefault(); qButton("Знаю").click(); }
  }
});
function qButton(text){
  var all = document.querySelectorAll("#view button");
  for(var i = 0; i < all.length; i++)
    if(all[i].textContent === text && !all[i].disabled) return all[i];
  return null;
}
/* горизонтальний свайп на елементі */
function onSwipe(node, onLeft, onRight){
  var x0 = null, y0 = null;
  node.addEventListener("touchstart", function(e){
    var t = e.changedTouches[0]; x0 = t.clientX; y0 = t.clientY;
  }, {passive:true});
  node.addEventListener("touchend", function(e){
    if(x0 === null) return;
    var t = e.changedTouches[0], dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
    if(Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.5){
      if(dx < 0) onLeft(); else onRight();
    }
  }, {passive:true});
}
function plural(n, one, few, many){
  var m10 = n % 10, m100 = n % 100;
  if(m10 === 1 && m100 !== 11) return one;
  if(m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}

/* Український переклад пояснення з прихованою відповіддю.
   У завданні на введення/впізнавання ховаємо саме те, що треба назвати:
   для абревіатур — саму абревіатуру (en у перекладі), для решти — нічого не ховаємо
   (український термін лишається підказкою, як і англійський). */
function ukrHideAnswer(t){
  if(!t.xu) return "";
  return (t.en && t.xu.indexOf(t.en) >= 0) ? t.xu.split(t.en).join("________") : t.xu;
}
/* Для вибору терміна за означенням ховаємо назву поняття,
   щоб український рядок не підказував відповідь: абревіатуру, якщо вона є в перекладі,
   інакше — сам український термін. */
function ukrHideConcept(t){
  if(!t.xu) return "";
  var s = t.xu;
  if(t.en && s.indexOf(t.en) >= 0) return s.split(t.en).join("________");
  /* ховаємо будь-який варіант українського терміна (через «/» або кому), без дужкових уточнень */
  (t.ua || "").split(/[\/,]/).forEach(function(p){
    p = p.replace(/\(.*?\)/g, "").trim();
    if(p.length >= 3 && s.indexOf(p) >= 0) s = s.split(p).join("________");
  });
  return s;
}

/* ================= маршрутизація ================= */
var view = document.getElementById("view");
var stack = [];
function go(fn, keep){
  if(!keep) stack.push(fn);
  view.innerHTML = "";
  fn();
  window.scrollTo(0, 0);
  if(TG && TG.BackButton){
    try{ stack.length > 1 ? TG.BackButton.show() : TG.BackButton.hide(); }catch(e){}
  }
}
function back(){
  stack.pop();
  var f = stack[stack.length - 1] || screenHome;
  go(f, true);
}
if(TG && TG.BackButton){ try{ TG.BackButton.onClick(back); }catch(e){} }
function backLink(){
  var a = el("div", "back", "← назад");
  a.onclick = back;
  return a;
}
document.getElementById("f-home").onclick = function(){ stack = []; go(screenHome); };
/* Перезавантаження з обходом кешу Telegram: новий параметр в URL змушує клієнт
   завантажити свіжу версію з хостингу, без видалення й повторного додавання бота.
   Прогрес не втрачається — він у CloudStorage, а не в сторінці. */
document.getElementById("f-reload").onclick = function(){
  try{ saveNow(); }catch(e){}
  if(!confirm("Оновити застосунок до останньої версії? Прогрес збережеться.")) return;
  var base = location.href.split("#")[0].split("?")[0];
  location.replace(base + "?r=" + Date.now());
};

function moduleStats(m){
  var total = 0, done = 0, learned = 0, terms = 0;
  m.themes.forEach(function(th){
    th.lessons.forEach(function(l){
      total++;
      if(lessonDone(l.id)) done++;
      l.terms.forEach(function(t){ terms++; if(mastered(t.k)) learned++; });
    });
  });
  return {lessons:total, done:done, terms:terms, learned:learned};
}
function dueTerms(){
  return ALL.filter(function(t){

    return s && s.n > 0 && s.due <= DAY;

}

/* ---- експорт / імпорт прогресу файлом ---- */
function exportProgress(){
  var data = JSON.stringify(P);
  var name = "progress-" + new Date().toISOString().slice(0, 10) + ".json";
  var ok = false;
  try{
    var blob = new Blob([data], {type: "application/json"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    ok = true;
  }catch(e){}
  /* у Telegram завантаження може бути заблоковане — показуємо текст для копіювання */
  view.innerHTML = "";
  view.appendChild(backLink());
  view.appendChild(el("h1", "", "Експорт прогресу"));
  view.appendChild(el("div", "sub", ok
    ? "Файл " + name + " збережено. Якщо завантаження не почалося, скопіюйте текст нижче й збережіть його."
    : "Скопіюйте цей текст і збережіть — це резервна копія вашого прогресу."));
  var ta = el("textarea", "io");
  ta.value = data; ta.readOnly = true;
  view.appendChild(ta);
  var r = el("div", "row");
  var cp = el("button", "act", "Копіювати");
  cp.onclick = function(){
    try{ ta.select(); document.execCommand("copy"); cp.textContent = "Скопійовано ✓"; }catch(e){}
    try{ if(navigator.clipboard) navigator.clipboard.writeText(data); }catch(e){}
  };
  r.appendChild(cp);
  view.appendChild(r);
}
function importProgress(){
  view.innerHTML = "";
  view.appendChild(backLink());
  view.appendChild(el("h1", "", "Імпорт прогресу"));
  view.appendChild(el("div", "sub", "Вставте збережений текст прогресу або оберіть файл. Поточний прогрес буде замінено."));

  var r = el("div", "row");

      stack = []; go(screenHome);

  };
  r.appendChild(b);

}

/* ---------- етап 1: картки ---------- */
function stageLearn(m, th, l){
  var queue = shuffle(l.terms.slice());
  var total = queue.length, seen = 0;
  view.appendChild(backLink());
  var head = el("div", "between");
  var counter = el("div", "sub", "");
  head.appendChild(el("h1", "", "Вивчення"));
  head.appendChild(counter);
  view.appendChild(head);
  var host = el("div");
  view.appendChild(host);

  function next(){
    host.innerHTML = "";
    counter.textContent = seen + " / " + total;
    if(!queue.length){
      lessonState(l.id).learn = 1;
      touchStreak(); saveSoon();
      var done = el("div", "card");
      done.appendChild(el("h3", "", "Картки пройдено"));
      done.appendChild(el("div", "sub", "Тепер закріплення — саме там слова переходять у активний запас."));
      var r = el("div", "row");
      var b = el("button", "act", "До закріплення");
      b.onclick = function(){ go(function(){ stagePractice(m, th, l); }, true); };
      var b2 = el("button", "ghost", "До уроку");
      b2.onclick = back;
      r.appendChild(b); r.appendChild(b2);
      done.appendChild(r);
      host.appendChild(done);
      return;
    }
    var t = queue[0];
    var c = el("div", "card tap");
    var f = el("div", "flash");
    f.appendChild(el("div", "big", t.en));
    var sp = el("button", "speak", "🔊 прослухати");
    sp.onclick = function(ev){ ev.stopPropagation(); speak(t.en); };
    f.appendChild(sp);
    f.appendChild(el("div", "hint", "натисніть, щоб побачити переклад · пробіл"));
    c.appendChild(f);
    c.onclick = function(){ flip(t, c); };
    host.appendChild(c);

    var row = el("div", "row");
    var known = el("button", "ghost small", "Вже знаю ✓");
    known.onclick = function(){ queue.shift(); seen++; markKnown(t.k); next(); };
    row.appendChild(known);
    host.appendChild(row);
  }

  function mark(t, good){
    if(good){ queue.shift(); seen++; answer(t.k, true, false); }
    else { queue.push(queue.shift()); }   /* «ще раз»: не караємо, повертаємо в кінець */
    next();
  }

  function flip(t, c){
    c.innerHTML = "";
    c.className = "card";
    var f = el("div", "flash");
    f.appendChild(el("div", "big", t.en));
    f.appendChild(el("div", "mid", t.ua));
    f.appendChild(el("div", "expl", t.ex));
    if(t.xu) f.appendChild(el("div", "expl", t.xu));
    var sp = el("button", "speak", "🔊 EN");
    sp.onclick = function(){ speak(t.en + ". " + t.ex); };
    f.appendChild(sp);
    c.appendChild(f);
    var r = el("div", "row");
    var ok = el("button", "act", "Знаю");
    ok.onclick = function(){ mark(t, true); };
    var again = el("button", "ghost", "Ще раз");
    again.onclick = function(){ mark(t, false); };
    r.appendChild(ok); r.appendChild(again);
    c.appendChild(r);
    c.appendChild(el("div", "tiny", "→ знаю · ← ще раз · клавіші 1 / 2"));
    onSwipe(c, function(){ mark(t, false); }, function(){ mark(t, true); });
  }

  next();
}

  return items;
}

  view.innerHTML = "";
  view.appendChild(backLink());
  var head = el("div", "between");
  head.appendChild(el("h1", "", title));
  var counter = el("div", "sub", "");
  head.appendChild(counter);
  view.appendChild(head);
  view.appendChild(el("div", "sub", subtitle));
  var host = el("div");
  view.appendChild(host);

  var queue = items.slice(), total = items.length, done = 0, ok = 0;

  function next(){
    host.innerHTML = "";
    counter.textContent = done + " / " + total;
    if(!queue.length){
      onDone();
      var c = el("div", "card");
      c.appendChild(el("h3", "", "Готово"));
      c.appendChild(el("div", "sub", "Правильно з першого разу: " + ok + " з " + total));
      var r = el("div", "row");
      var b = el("button", "act", "Далі");
      b.onclick = back;
      r.appendChild(b);
      c.appendChild(r);
      host.appendChild(c);
      haptic("success");
      return;
    }
    var it = queue[0];
    var c = el("div", "card");
    if(it.kind === "def"){
      c.appendChild(el("div", "tiny", "Оберіть термін за означенням"));
      c.appendChild(el("div", "mid", hideTerm(it.t)));
      if(it.t.xu) c.appendChild(el("div", "expl", ukrHideConcept(it.t)));
      c.appendChild(mcq(shuffle([it.t.en].concat(it.t.dis)), it.t.en, it));
    } else if(it.kind === "ua"){
      c.appendChild(el("div", "tiny", "Як це англійською?"));
      c.appendChild(el("div", "mid", it.t.ua));
      c.appendChild(mcq(shuffle([it.t.en].concat(it.t.dis)), it.t.en, it));
    } else if(it.kind === "dict"){
      c.appendChild(el("div", "tiny", "Диктант — почуйте й впишіть слово"));
      var play = el("button", "act", "🔊 Прослухати ще раз");
      play.onclick = function(){ speak(it.t.en); };
      c.appendChild(play);
      c.appendChild(el("div", "hint", "укр.: " + it.t.ua));
      c.appendChild(typeIn(it));
      setTimeout(function(){ speak(it.t.en); }, 300);
    } else {
      c.appendChild(el("div", "tiny", "Впишіть пропущений термін"));
      c.appendChild(el("div", "mid", it.t.cloze.replace("……", "________")));
      if(it.t.xu) c.appendChild(el("div", "expl", ukrHideAnswer(it.t)));
      else c.appendChild(el("div", "hint", "укр.: " + it.t.ua));
      c.appendChild(typeIn(it));
    }
    host.appendChild(c);
  }

  function hideTerm(t){
    var re = new RegExp("\\b" + t.en.replace(/[.*+?^${}()|[\]\\\/]/g, "\\$&") + "\\b", "ig");
    return t.ex.replace(re, "________");
  }

  function resolve(it, good, node, recall){
    answer(it.t.k, good, recall);
    haptic(good ? "success" : "error");
    queue.shift();
    if(good){ done++; ok++; }
    else { done++; queue.push(it); total++; }
    var r = el("div", "row");
    var b = el("button", "act", "Далі");
    b.onclick = next;
    r.appendChild(b);
    if(!good) r.appendChild(el("span", "hint", "це слово повернеться в кінці"));
    node.appendChild(r);
    setTimeout(function(){ try{ b.focus(); }catch(e){} }, 30);
  }

  function feedback(it){
    var note = el("div", "");
    note.appendChild(el("div", "hint", it.t.ua + " — " + it.t.ex));
    if(it.t.xu) note.appendChild(el("div", "hint", it.t.xu));
    return note;
  }

  function mcq(opts, right, it){
    var wrap = el("div", "opts");
    var used = false;
    opts.forEach(function(o){
      var b = el("button", "", o);
      b.onclick = function(){
        if(used) return;
        used = true;
        Array.prototype.forEach.call(wrap.children, function(x){
          x.disabled = true;
          if(x.textContent === right) x.className = "good";
        });
        if(o !== right) b.className = "bad";
        wrap.parentNode.appendChild(feedback(it));
        resolve(it, o === right, wrap.parentNode, false);   /* вибір із варіантів = впізнавання */
      };
      wrap.appendChild(b);
    });
    return wrap;
  }

  function typeIn(it){
    var wrap = el("div", "");
    var i = el("input", "tin");
    i.type = "text"; i.autocapitalize = "off"; i.autocomplete = "off"; i.spellcheck = false;
    i.placeholder = "англійською";
    var r = el("div", "row");
    var b = el("button", "act", "Перевірити");
    var out = el("div", "");
    var used = false;
    function check(){
      if(used) return;
      var res = grade(i.value, it.t.acc);
      i.className = "tin " + (res === "ok" ? "good" : res === "near" ? "near" : "bad");
      i.disabled = true; b.disabled = true;
      used = true;
      out.innerHTML = "";
      if(res !== "ok")
        out.appendChild(el("div", "hint",
          (res === "near" ? "майже — правильно: " : "правильно: ") + it.t.en));
      out.appendChild(feedback(it));
      resolve(it, !!res, wrap, true);   /* введення з голови = відтворення */
    }
    b.onclick = check;
    i.onkeydown = function(e){ if(e.key === "Enter"){ e.preventDefault(); check(); } };
    r.appendChild(i); r.appendChild(b);
    wrap.appendChild(r);
    wrap.appendChild(out);
    setTimeout(function(){ try{ i.focus(); }catch(e){} }, 50);
    return wrap;
  }

  next();
}

/* ================= контекст: діалоги ================= */
function buildGapped(host, text, re, make){
  var last = 0, m;
  re.lastIndex = 0;
  while((m = re.exec(text)) !== null){
    if(m.index > last) host.appendChild(document.createTextNode(text.slice(last, m.index)));
    host.appendChild(make(m[1] ? parseInt(m[1], 10) : 0));
    last = m.index + m[0].length;
  }
  if(last < text.length) host.appendChild(document.createTextNode(text.slice(last)));
}
function accepted(g){ return g.alt ? [g.a].concat(g.alt) : [g.a]; }

function checkGaps(fields, out, doneKey){
  var ok = 0;
  fields.forEach(function(x){
    var res = grade(x.f.value, accepted(x.g));
    x.f.className = "gap " + (res === "ok" ? "good" : res === "near" ? "near" : "bad");
    if(x.f.nextSibling && x.f.nextSibling.className === "fix")
      x.f.parentNode.removeChild(x.f.nextSibling);
    if(res !== "ok") x.f.parentNode.insertBefore(el("span", "fix", "→ " + x.g.a), x.f.nextSibling);
    if(res) ok++;
    if(x.key) answer(x.key, !!res);
  });
  var full = ok === fields.length;
  if(doneKey && full) markCtx(doneKey);   /* зараховуємо контекст лише за повністю правильне проходження */
  out.innerHTML = "";
  var sc = el("div", "score", "Правильно " + ok + " з " + fields.length +
    (doneKey && full ? " · пройдено" : ""));
  if(ok < fields.length * 0.7) sc.className = "score low";
  out.appendChild(sc);
  haptic(full ? "success" : "warning");
  saveSoon();
}

function makeField(g, mode){
  if(mode === "choice"){
    var s = el("select", "gap");
    s.appendChild(el("option", "", "— обрати —")).value = "";
    shuffle(g.opts).forEach(function(o){
      var op = el("option", "", o);
      op.value = o;
      s.appendChild(op);
    });
    return s;
  }
  var i = el("input", "gap");
  i.type = "text"; i.autocapitalize = "off"; i.autocomplete = "off"; i.spellcheck = false;
  i.placeholder = g.ua || "";
  i.title = g.ua || "";
  return i;
}

function screenText(m, t, mode){
  view.appendChild(backLink());
  view.appendChild(el("h1", "", t.title));
  view.appendChild(el("div", "sub", t.ua));

  var c = el("div", "card");
  if(mode === "type"){
    c.appendChild(el("div", "hint", "Банк слів:"));
    var bank = el("div", "bank");
    shuffle(t.gaps.map(function(g){ return g.a; })).forEach(function(w){
      bank.appendChild(el("span", "", w));
    });
    c.appendChild(bank);
  }
  var fields = [];
  t.lines.forEach(function(ln){
    var row = el("div", "line");
    if(ln[0]) row.appendChild(el("div", "who", ln[0] + ":"));
    var txt = el("div", "txt");
    buildGapped(txt, ln[1], /\{(\d+)\}/g, function(idx){
      var g = t.gaps[idx - 1];
      var f = makeField(g, mode);
      fields.push({f:f, g:g, key:IDX[m.id + ":" + g.a] ? m.id + ":" + g.a : null});
      return f;
    });
    row.appendChild(txt);
    c.appendChild(row);
  });
  var out = el("div");
  var r = el("div", "row");
  var b = el("button", "act", "Перевірити");
  b.onclick = function(){ checkGaps(fields, out, ctxKey(m.id, "t", t.id)); };
  var b2 = el("button", "ghost", "Ще раз");
  b2.onclick = function(){ go(function(){ screenText(m, t, mode); }, true); };
  var b3 = el("button", "ghost", mode === "choice" ? "Режим: вписати" : "Режим: варіанти");
  b3.onclick = function(){
    go(function(){ screenText(m, t, mode === "choice" ? "type" : "choice"); }, true);
  };
  r.appendChild(b); r.appendChild(b2); r.appendChild(b3);
  c.appendChild(r);
  c.appendChild(out);
  view.appendChild(c);
}

function screenDrill(m, d, di){
  view.appendChild(backLink());
  view.appendChild(el("h1", "", d.title));
  view.appendChild(el("div", "sub", d.ua));
  var c = el("div", "card");
  var fields = [];
  d.items.forEach(function(it){
    var p = el("p", "para");
    buildGapped(p, it.s, /\{\}/g, function(){
      var s = el("select", "gap");
      s.appendChild(el("option", "", "— обрати —")).value = "";
      shuffle(d.set).forEach(function(w){
        var op = el("option", "", w);
        op.value = w;
        s.appendChild(op);
      });
      fields.push({f:s, g:{a:it.a, alt:[it.a.replace(/s$/, ""), it.a + "s"]}, key:null});
      return s;
    });
    c.appendChild(p);
  });
  var out = el("div");
  var r = el("div", "row");
  var b = el("button", "act", "Перевірити");
  b.onclick = function(){ checkGaps(fields, out, ctxKey(m.id, "d", di)); };
  r.appendChild(b);
  c.appendChild(r);
  c.appendChild(out);
  view.appendChild(c);
}

/* ================= словник ================= */
var GL = {q:"", alpha:false, onlyNew:false};

function statusPill(k){
  if(mastered(k)) return el("span", "pill done nowrap", "засвоєно");
  if(P.t[k]) return el("span", "pill nowrap", "вивчається");
  return el("span", "pill nowrap", "нове");
}

/* один рядок словника: термін, переклад, пояснення, озвучення, статус, «вже знаю» */
function termRow(t, where, onChange){
  var it = el("div", "list-item");
  var g = el("div", "grow");
  var head = el("div", "");
  head.appendChild(el("b", "", t.en));
  head.appendChild(document.createTextNode(" — " + t.ua));
  g.appendChild(head);
  g.appendChild(el("div", "tiny", t.ex));
  if(t.xu) g.appendChild(el("div", "tiny", t.xu));
  if(where) g.appendChild(el("div", "tiny", where));
  it.appendChild(g);
  var right = el("div", "nowrap");
  var sp = el("button", "speak", "🔊");
  sp.onclick = function(){ speak(t.en + ". " + t.ex); };
  right.appendChild(sp);
  if(!mastered(t.k)){
    var kn = el("button", "speak", "знаю");
    kn.title = "позначити як засвоєне";
    kn.onclick = function(){ markKnown(t.k); if(onChange) onChange(); };
    right.appendChild(kn);
  }
  right.appendChild(statusPill(t.k));
  it.appendChild(right);
  return it;
}

function glossaryBody(host){
  host.appendChild(el("div", "sub",
    ALL.length + " термінів з перекладом і поясненням англійською"));

  var i = el("input", "tin");
  i.type = "search";
  i.placeholder = "пошук: слово, переклад або текст пояснення";
  i.style.maxWidth = "100%";
  i.value = GL.q;
  host.appendChild(i);
  var out = el("div");
  host.appendChild(out);

  function themeOf(t){
    var found = "";
    C.modules.forEach(function(m){
      m.themes.forEach(function(th){
        th.lessons.forEach(function(l){
          if(l.terms.indexOf(t) >= 0) found = m.title + " · " + th.title;
        });
      });
    });
    return found;
  }

  function run(){
    GL.q = i.value.trim();
    var q = GL.q.toLowerCase();
    out.innerHTML = "";

    if(q.length >= 2){
      var hits = ALL.filter(function(t){
        return t.en.toLowerCase().indexOf(q) >= 0 ||
               t.ua.toLowerCase().indexOf(q) >= 0 ||
               t.ex.toLowerCase().indexOf(q) >= 0;
      });
      out.appendChild(el("div", "sub", "Знайдено: " + hits.length));
      var c = el("div", "card");
      hits.slice(0, 60).forEach(function(t){ c.appendChild(termRow(t, themeOf(t), run)); });
      if(!hits.length) c.appendChild(el("div", "hint", "Нічого не знайдено"));
      out.appendChild(c);
      return;
    }

    C.modules.forEach(function(m){
      out.appendChild(el("h2", "", m.title));
      var c = el("div", "card");
      m.themes.forEach(function(th){
        var terms = [], learned = 0;
        th.lessons.forEach(function(l){
          l.terms.forEach(function(t){
            terms.push(t);
            if(mastered(t.k)) learned++;
          });
        });
        var it = el("div", "list-item tap");
        var g = el("div", "grow");
        g.appendChild(el("div", "", th.title));
        g.appendChild(el("div", "tiny", terms.length + " термінів · засвоєно " + learned));
        it.appendChild(g);
        it.appendChild(el("span", "pill nowrap", "відкрити"));
        it.onclick = function(){ go(function(){ screenGlossaryTheme(m, th); }); };
        c.appendChild(it);
      });
      out.appendChild(c);
    });
  }

  i.oninput = run;
  run();
}

function screenGlossaryTheme(m, th){
  view.innerHTML = "";
  view.appendChild(backLink());
  view.appendChild(el("h1", "", th.title));
  view.appendChild(el("div", "sub", m.title));

  var r = el("div", "row");
  var b1 = el("button", GL.alpha ? "ghost small on" : "ghost small", "за алфавітом");
  b1.onclick = function(){ GL.alpha = !GL.alpha; go(function(){ screenGlossaryTheme(m, th); }, true); };
  var b2 = el("button", GL.onlyNew ? "ghost small on" : "ghost small", "лише незасвоєні");
  b2.onclick = function(){ GL.onlyNew = !GL.onlyNew; go(function(){ screenGlossaryTheme(m, th); }, true); };
  r.appendChild(b1); r.appendChild(b2);
  view.appendChild(r);

  var rerender = function(){ go(function(){ screenGlossaryTheme(m, th); }, true); };
  var shown = 0;
  if(GL.alpha){
    var all = [];
    th.lessons.forEach(function(l){ all = all.concat(l.terms); });
    all.sort(function(a, b){ return a.en.toLowerCase() < b.en.toLowerCase() ? -1 : 1; });
    var c = el("div", "card");
    all.forEach(function(t){
      if(GL.onlyNew && mastered(t.k)) return;
      c.appendChild(termRow(t, null, rerender));
      shown++;
    });
    view.appendChild(c);
  } else {
    th.lessons.forEach(function(l){
      var rows = l.terms.filter(function(t){ return !(GL.onlyNew && mastered(t.k)); });
      if(!rows.length) return;
      view.appendChild(el("h2", "", l.title));
      var c = el("div", "card");
      rows.forEach(function(t){ c.appendChild(termRow(t, null, rerender)); shown++; });
      view.appendChild(c);
    });
  }
  if(!shown) view.appendChild(el("div", "hint", "У цій темі засвоєно всі терміни."));
}

/* ================= старт ================= */
loadProgress(function(){ go(screenHome); });
</script>
