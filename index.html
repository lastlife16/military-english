<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Військова англійська — курс</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* Світла палітра — типова */
:root,
:root[data-theme="light"]{
  --bg:#f4f5f7; --card:#fff; --fg:#15181d; --dim:#6b7280; --line:#dfe3e8;
  --accent:#2563eb; --ok:#15803d; --okbg:#dcfce7; --bad:#b91c1c; --badbg:#fee2e2;
  --warn:#a16207; --warnbg:#fef3c7;
}
/* Темна — за системною темою або за атрибутом від Telegram */
@media (prefers-color-scheme:dark){
  :root{--bg:#101215;--card:#181b20;--fg:#e8eaed;--dim:#9aa1ab;--line:#2a2f36;
        --accent:#60a5fa;--ok:#4ade80;--okbg:#14361f;--bad:#f87171;--badbg:#3a1618;
        --warn:#fbbf24;--warnbg:#3a2e0c;}
}
:root[data-theme="dark"]{
  --bg:#101215;--card:#181b20;--fg:#e8eaed;--dim:#9aa1ab;--line:#2a2f36;
  --accent:#60a5fa;--ok:#4ade80;--okbg:#14361f;--bad:#f87171;--badbg:#3a1618;
  --warn:#fbbf24;--warnbg:#3a2e0c;
}
body.tg{
  --bg:var(--tg-theme-bg-color,#101215);
  --card:var(--tg-theme-secondary-bg-color,#181b20);
  --fg:var(--tg-theme-text-color,#e8eaed);
  --dim:var(--tg-theme-hint-color,#9aa1ab);
  --accent:var(--tg-theme-button-color,#60a5fa);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
  font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
#wrap{max-width:820px;margin:0 auto;padding:12px 14px 80px}
h1{font-size:19px;margin:0 0 2px}
h2{font-size:17px;margin:14px 0 4px}
.sub{color:var(--dim);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;
  padding:14px 15px;margin:10px 0}
.tap{cursor:pointer}
.tap:active{opacity:.7}
.card h3{margin:0 0 2px;font-size:16px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
button{font:inherit}
.act{padding:11px 16px;border-radius:10px;border:1px solid var(--accent);
  background:var(--accent);color:#fff;font-size:15px;cursor:pointer}
.act:disabled{opacity:.45;cursor:default}
.ghost{padding:10px 14px;border-radius:10px;border:1px solid var(--line);
  background:transparent;color:var(--fg);font-size:15px;cursor:pointer}
.ghost.on{border-color:var(--accent);color:var(--accent)}
.small{font-size:13px;padding:7px 11px}
.back{color:var(--accent);font-size:14px;cursor:pointer;display:inline-block;margin:2px 0 6px}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.pill{font-size:12px;color:var(--dim);border:1px solid var(--line);border-radius:99px;padding:2px 9px}
.pill.done{color:var(--ok);border-color:var(--ok)}
.pill.soon{color:var(--warn);border-color:var(--warn)}
.flash{min-height:150px;display:flex;flex-direction:column;justify-content:center;
  align-items:center;text-align:center;gap:8px;padding:22px 10px}
.big{font-size:26px;font-weight:600;line-height:1.25}
.mid{font-size:19px}
.expl{color:var(--dim);font-size:14px;max-width:34em}
.opts{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.opts button{text-align:left;padding:11px 13px;border:1px solid var(--line);border-radius:10px;
  background:transparent;color:var(--fg);font-size:15px;cursor:pointer}
.opts button.good{border-color:var(--ok);background:var(--okbg)}
.opts button.bad{border-color:var(--bad);background:var(--badbg)}
.opts button:disabled{cursor:default}
input.gap,input.tin{font:inherit;font-size:16px;padding:8px 11px;border:1px solid var(--line);
  border-radius:9px;background:var(--bg);color:var(--fg);width:100%;max-width:16em}
input.gap{padding:2px 7px;border:0;border-bottom:2px solid var(--accent);background:transparent;
  width:9.5em;border-radius:3px 3px 0 0;font-size:15px}
select.gap{font:inherit;font-size:15px;padding:3px 6px;border:1px solid var(--accent);
  border-radius:7px;background:var(--card);color:var(--fg);max-width:100%}
.gap.good,.tin.good{border-color:var(--ok);background:var(--okbg)}
.gap.bad,.tin.bad{border-color:var(--bad);background:var(--badbg)}
.gap.near,.tin.near{border-color:var(--warn);background:var(--warnbg)}
.fix{color:var(--bad);font-size:13px;margin-left:4px;white-space:nowrap}
.hint{color:var(--dim);font-size:13px}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.bank span{border:1px dashed var(--line);border-radius:7px;padding:3px 9px;font-size:13px;color:var(--dim)}
.line{display:flex;gap:8px;margin:7px 0;align-items:baseline}
.who{flex:0 0 22px;color:var(--accent);font-weight:600;font-size:13px}
.txt{flex:1}
p.para{margin:9px 0}
.score{font-size:14px;padding:8px 12px;border-radius:9px;background:var(--okbg);color:var(--ok);
  display:inline-block;margin-top:8px}
.score.low{background:var(--badbg);color:var(--bad)}
textarea.io{width:100%;min-height:140px;margin:8px 0;padding:10px;border:1px solid var(--line);
  border-radius:9px;background:var(--card);color:var(--fg);font:13px/1.4 monospace;resize:vertical}
.hero{display:flex;align-items:center;gap:14px;margin:8px 0 4px}
.hero h1{margin:0 0 2px}
.tabs{display:flex;gap:6px;margin:12px 0 2px;position:sticky;top:0;background:var(--bg);
  padding:6px 0;z-index:5}
.tabs button{flex:1;padding:9px 6px;border:1px solid var(--line);border-radius:99px;
  background:var(--card);color:var(--fg);font-size:14px;cursor:pointer}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.badge{display:inline-block;min-width:18px;padding:0 5px;margin-left:5px;border-radius:99px;
  background:var(--bad);color:#fff;font-size:11px;line-height:17px;text-align:center}
.tabs button.on .badge{background:rgba(255,255,255,.28)}
.steps{display:flex;gap:6px;margin:10px 0 4px}
.steps div{flex:1;text-align:center;font-size:12px;color:var(--dim);
  border-bottom:3px solid var(--line);padding-bottom:5px}
.steps div.on{color:var(--accent);border-color:var(--accent)}
.steps div.ok{color:var(--ok);border-color:var(--ok)}
.speak{border:1px solid var(--line);background:transparent;color:var(--fg);border-radius:8px;
  padding:4px 9px;font-size:15px;cursor:pointer}
.res{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  padding:8px 14px;font-size:12px;color:var(--dim);display:flex;gap:12px;justify-content:center}
footer span{cursor:pointer}
.list-item{display:flex;justify-content:space-between;align-items:center;gap:10px;
  padding:11px 0;border-top:1px solid var(--line)}
.list-item:first-child{border-top:0}
.grow{flex:1;min-width:0}
.nowrap{white-space:nowrap}
.tiny{font-size:12px;color:var(--dim)}
</style>
</head>
<body>

</footer>

 Протока","Розгортка"],"k":"m1:Connect","xu":"Приєднати означає з'єднати між собою компоненти або системи."},{"en":"Repair","ua":"Відремонтувати","ex":"To repair means to restore a damaged part to working condition.","cloze":"To …… means to restore a damaged part to working condition.","acc":["repair"],"dis":["Fill","Remove","Blend"],"uadis":["Привод агрегатів","Теплова пастка","Електрогідравлічний клапан"],"k":"m1:Repair","xu":"Відремонтувати означає відновити пошкоджену деталь до робочого стану."},{"en":"Overhaul","ua":"Капітальний ремонт","ex":"Overhaul is a complete disassembly, inspection, and restoration of a unit.","cloze":"…… is a complete disassembly, inspection, and restoration of a unit.","acc":["overhaul"],"dis":["Rectify","Submit","Bleed"],"uadis":["Гвинт / Шуруп","Водовідділювач","Шайба"],"k":"m1:Overhaul","xu":"Капітальний ремонт — це повне розбирання, огляд і відновлення агрегата."},{"en":"Withdraw","ua":"Витягти","ex":"To withdraw means to pull out, for example a pin or cartridge.","cloze":"To …… means to pull out, for example a pin or cartridge.","acc":["withdraw"],"dis":["Lubricate","Adjust","Secure"],"uadis":["Наповнити / Заправити","Конденсатор","Вузол підвіски"],"k":"m1:Withdraw","xu":"Витягти означає вийняти, наприклад чеку або патрон."},{"en":"Detach","ua":"Відкріпити","ex":"To detach means to release something held by clips or locks.","cloze":"To …… means to release something held by clips or locks.","acc":["detach"],"dis":["Adjust","Torque","Connect"],"uadis":["Канал / Протока","Відбірне повітря","Окуляри нічного бачення"],"k":"m1:Detach","xu":"Відкріпити означає звільнити те, що тримається на кліпсах чи замках."},{"en":"Attach","ua":"Прикріпити","ex":"To attach means to fix a component using fasteners.","cloze":"To …… means to fix a component using fasteners.","acc":["attach"],"dis":["Retract","Detach","Rectify"],"uadis":["Гідробак","Кут місця","Окуляри нічного бачення"],"k":"m1:Attach","xu":"Прикріпити означає закріпити компонент за допомогою кріплення."},{"en":"Access","ua":"Доступ","ex":"Access means opening panels or hatches to reach internal components.","cloze":"…… means opening panels or hatches to reach internal components.","acc":["access"],"dis":["Blend","Replace","Connect"],"uadis":["Плашка","Лопатка","Дріт заземлення"],"k":"m1:Access","xu":"Доступ означає відкрити панелі чи люки, щоб дістатися до внутрішніх вузлів."},{"en":"Align","ua":"Вирівняти / Сумістити","ex":"To align means to position parts correctly relative to each other.","cloze":"To …… means to position parts correctly relative to each other.","acc":["align"],"dis":["Overhaul","Calibrate","Lubricate"],"uadis":["Від'єднати","Приймач попередження про опромінення","Паливна форсунка"],"k":"m1:Align","xu":"Вирівняти означає правильно розташувати деталі одну відносно одної."},{"en":"Bleed","ua":"Прокачати","ex":"To bleed means to remove air from a hydraulic or fuel system.","cloze":"To …… means to remove air from a hydraulic or fuel system.","acc":["bleed"],"dis":["Verify","Incorporate","Purge"],"uadis":["Шестигранна головка","Серійний номер","НДЖ у складі літака"],"k":"m1:Bleed","xu":"Прокачати означає видалити повітря з гідравлічної чи паливної системи."},{"en":"Blend","ua":"Зачистити (сплавно)","ex":"To blend means to smooth out sharp edges on damaged metal.","cloze":"To …… means to smooth out sharp edges on damaged metal.","acc":["blend"],"dis":["Lubricate","Retract","Retighten"],"uadis":["Автоматичний вимикач","Токсично","Боєприпаси"],"k":"m1:Blend","xu":"Зачистити означає плавно згладити гострі кромки на пошкодженому металі."},{"en":"Calibrate","ua":"Калібрувати","ex":"To calibrate means to verify and adjust the accuracy of an instrument.","cloze":"To …… means to verify and adjust the accuracy of an instrument.","acc":["calibrate"],"dis":["Pressurize","Bleed","Incorporate"],"uadis":["Підвісний бак","Передня стійка шасі","Прикріпити"],"k":"m1:Calibrate","xu":"Калібрувати означає перевірити й підлаштувати точність приладу."}]},{"id":"m1:182e0d56","title":"Виконання робіт (дієслова) — ч. 2","terms":[{"en":"Drain","ua":"Злити","ex":"To drain means to completely remove fluid from a tank or system.","cloze":"To …… means to completely remove fluid from a tank or system.","acc":["drain"],"dis":["Connect","Perform","Repair"],"uadis":["Гальмівний диск","Вхідний напрямний апарат","Впровадити"],"k":"m1:Drain","xu":"Злити означає повністю видалити рідину з бака чи системи."},{"en":"Fill","ua":"Наповнити / Заправити","ex":"To fill means to add fluid up to the required level.","cloze":"To …… means to add fluid up to the required level.","acc":["fill"],"dis":["Detach","Attach","Closure"],"uadis":["Постановка завад","Інвертор","Подряпина"],"k":"m1:Fill","xu":"Наповнити означає долити рідину до потрібного рівня."},{"en":"Flush","ua":"Промити","ex":"To flush means to clean a system by passing fluid through it.","cloze":"To …… means to clean a system by passing fluid through it.","acc":["flush"],"dis":["Modify","Drain","Rectify"],"uadis":["Прошивка","Корончаста гайка","Відповідач"],"k":"m1:Flush","xu":"Промити означає очистити систему, пропустивши через неї рідину."},{"en":"Isolate","ua":"Ізолювати","ex":"Isolate means to cut off the supply of fluid or electrical power.","cloze":"…… means to cut off the supply of fluid or electrical power.","acc":["isolate"],"dis":["Flush","Examine","Attach"],"uadis":["Перелік мінімального обладнання","Буксирувальне водило","Компресор"],"k":"m1:Isolate","xu":"Ізолювати означає перекрити подачу рідини або електроживлення."},{"en":"Lubricate","ua":"Змастити","ex":"To lubricate means to apply oil or grease to moving parts.","cloze":"To …… means to apply oil or grease to moving parts.","acc":["lubricate"],"dis":["Isolate","Submit","Safety"],"uadis":["Підтягнути","Записати / Задокументувати","Манометр"],"k":"m1:Lubricate","xu":"Змастити означає нанести оливу або мастило на рухомі частини."},{"en":"Purge","ua":"Продути","ex":"To purge means to remove remaining fuel or gas from a l но","Задня кромка","Рівень рідини"],"k":"m1:EPU","xu":"НДЖ — це власне аварійне джерело живлення літака."},{"en":"GPU","ua":"НДЖ (контейнер)","ex":"The GPU is the Ground Power Unit — an external power source.","cloze":"The …… is the Ground Power Unit — an external power source.","acc":["gpu"],"dis":["Tug / Tractor","Fuel tanker","Nitrogen cart"],"uadis":["Замок / Клямка","Кут місця","Водовідділювач"],"k":"m1:GPU","xu":"НДЖ — це наземне джерело живлення, зовнішнє джерело електрики."},{"en":"Fuel tanker","ua":"Паливозаправник","ex":"The fuel tanker is the vehicle used to refuel the aircraft.","cloze":"The …… is the vehicle used to refuel the aircraft.","acc":["fuel tanker"],"dis":["Steps / Ladder","Tug / Tractor","Nitrogen cart"],"uadis":["Час після капремонту","Злити","Сигналізатор тиску"],"k":"m1:Fuel tanker","xu":"Паливозаправник — це машина, якою заправляють літак."},{"en":"Ground wire","ua":"Дріт заземлення","ex":"The ground wire removes static electricity before fueling.","cloze":"The …… removes static electricity before fueling.","acc":["ground wire"],"dis":["Steps / Ladder","Hydraulic mule","Fuel tanker"],"uadis":["Модифікувати","Шайба","Складка / Вигин"],"k":"m1:Ground wire","xu":"Дріт заземлення знімає статичну електрику перед заправкою."},{"en":"Hydraulic mule","ua":"Гідростенд","ex":"The hydraulic mule supplies pressure to the system without engine power.","cloze":"The …… supplies pressure to the system without engine power.","acc":["hydraulic mule"],"dis":["Fuel tanker","Tow bar","EPU"],"uadis":["Індикація (сигнал)","Візор","Подати тиск"],"k":"m1:Hydraulic mule","xu":"Гідростенд подає тиск у систему без роботи двигуна."},{"en":"Lifting jack","ua":"Домкрат","ex":"The lifting jack raises the aircraft off the ground for maintenance.","cloze":"The …… raises the aircraft off the ground for maintenance.","acc":["lifting jack"],"dis":["Tow bar","Steps / Ladder","Chocks"],"uadis":["Звалювання","Термін зберігання","Регулятор"],"k":"m1:Lifting jack","xu":"Домкрат п івельний фен використовують для усадки термоусадкової трубки."},{"en":"Soldering iron","ua":"Паяльник","ex":"A soldering iron melts solder to join electrical components.","cloze":"A …… melts solder to join electrical components.","acc":["soldering iron"],"dis":["Socket","Vacuum pump","Heat gun"],"uadis":["Не ставати","Магнітопорошковий метод","Трубка Піто"],"k":"m1:Soldering iron","xu":"Паяльник розплавляє припій, щоб з'єднати електричні компоненти."},{"en":"Impact wrench","ua":"Гайковерт","ex":"An impact wrench rapidly removes fasteners using rotating impacts.","cloze":"An …… rapidly removes fasteners using rotating impacts.","acc":["impact wrench"],"dis":["Feeler gauge","Screwdriver","Crimping tool"],"uadis":["Система повітропроводів","Інвертор","Основні стійки шасі"],"k":"m1:Impact wrench","xu":"Гайковерт швидко відкручує кріплення ударами, що обертають."},{"en":"Vacuum pump","ua":"Вакуумний насос","ex":"A vacuum pump removes air and moisture from systems.","cloze":"A …… removes air and moisture from systems.","acc":["vacuum pump"],"dis":["Tap","Torque multiplier","Soldering iron"],"uadis":["Регулювальна прокладка","Кермо напрямку","Відкачувальний насос"],"k":"m1:Vacuum pump","xu":"Вакуумний насос видаляє повітря й вологу із систем."}]}],"texts":[],"drills":[]},{"id":"d1d7cfa3","title":"Документація та статус деталей","lessons":[{"id":"m1:f5233bca","title":"Документація та статус деталей","terms":[{"en":"Logbook","ua":"Бортовий журнал","ex":"The logbook is the main document recording aircraft maintenance history.","cloze":"The …… is the main document recording aircraft maintenance history.","acc":["logbook"],"dis":["Expiry date","Shelf life","Serial Number"],"uadis":["Компресор","Кронштейн","Будівельний фен"],"k":"m1:Logbook","xu":"Бортовий журнал — це основний документ обліку історії обслуговування літака."},{"en":"Work Order","ua":"Наряд-замовлення","ex":"The work order is the document authorizing a specific maintenance task.","cloze":"The …… is the document au mber is the unique identifier for a specific unit.","cloze":"The …… is the unique identifier for a specific unit.","acc":["serial number"],"dis":["Logbook","Work Order","Expiry date"],"uadis":["Центр ваги","Захоплення цілі","Відповідач"],"k":"m1:Serial Number","xu":"Серійний номер — це унікальний ідентифікатор конкретного екземпляра."},{"en":"Lead Time","ua":"Термін виконання","ex":"Lead time is the time from ordering to delivery of a component.","cloze":"…… is the time from ordering to delivery of a component.","acc":["lead time"],"dis":["Consumable","Traceability","Revision"],"uadis":["Паливна форсунка","Аеродинамічний профіль","Набігаючий потік"],"k":"m1:Lead Time","xu":"Термін виконання — це час від замовлення до постачання компонента."},{"en":"AOG","ua":"Літак не може літати (статус)","ex":"AOG stands for Aircraft On Ground — the aircraft cannot fly due to a defect.","cloze":"…… stands for Aircraft On Ground — the aircraft cannot fly due to a defect.","acc":["aog"],"dis":["Part Number","Expiry date","Serviceable"],"uadis":["Компресор","Інерціальна навігаційна система","Подряпина"],"k":"m1:AOG","xu":"AOG означає, що літак прикутий до землі й не може літати через дефект."},{"en":"LRU","ua":"Блок лінійної заміни","ex":"LRU stands for Line Replaceable Unit — a component replaced as a whole.","cloze":"…… stands for Line Replaceable Unit — a component replaced as a whole.","acc":["lru"],"dis":["Part Number","AOG","Rotable"],"uadis":["Гайка","Завіса / Петля","Стороннє пошкодження"],"k":"m1:LRU","xu":"LRU — це блок лінійної заміни, компонент, що змінюється цілком."},{"en":"Rotable","ua":"Оборотний агрегат","ex":"A rotable component is repaired and returned to service after removal.","cloze":"A …… component is repaired and returned to service after removal.","acc":["rotable"],"dis":["Shelf life","Logbook","Traceability"],"uadis":["Ємність","Стороннє пошкодження","Головний вал"],"k":"m1:Rotable","xu":"Оборотний агрегат ремонтують і повертають в експлуатацію після зняття. ор","ex":"A vortex is turbulent rotating airflow at the wingtips.","cloze":"A …… is turbulent rotating airflow at the wingtips.","acc":["vortex"],"dis":["Chord","Drag","Stall"],"uadis":["Відстійник","Обтічник","Водовідділювач"],"k":"m1:Vortex","xu":"Вихор — це турбулентний обертовий потік повітря на кінцях крила."},{"en":"Stall","ua":"Звалювання","ex":"A stall occurs when the angle of attack exceeds the critical value and lift is lost.","cloze":"A …… occurs when the angle of attack exceeds the critical value and lift is lost.","acc":["stall"],"dis":["Angle of Attack","Leading edge","Lift"],"uadis":["Шайба","Захоплення цілі","Вирівняти / Сумістити"],"k":"m1:Stall","xu":"Звалювання настає, коли кут атаки перевищує критичний і підйомна сила зникає."}]}],"texts":[],"drills":[]},{"id":"35c3deee","title":"Безпека та знаки","lessons":[{"id":"m1:971ca43c","title":"Безпека та знаки","terms":[{"en":"Warning","ua":"Попередження","ex":"Warning indicates risk of serious injury or death.","cloze":"…… indicates risk of serious injury or death.","acc":["warning"],"dis":["No Step","Caution","Keep clear"],"uadis":["Демонтувати / Зняти","Повітря-повітря","Оборотний агрегат"],"k":"m1:Warning","xu":"Попередження вказує на ризик серйозної травми чи загибелі."},{"en":"Caution","ua":"Застереження","ex":"Caution indicates risk of damage to equipment.","cloze":"…… indicates risk of damage to equipment.","acc":["caution"],"dis":["Toxic","Warning","DANGER"],"uadis":["Система повітропроводів","Антена","Взаємозамінний"],"k":"m1:Caution","xu":"Застереження вказує на ризик пошкодження обладнання."},{"en":"DANGER","ua":"Небезпека","ex":"Danger marks zones of maximum risk such as engine intakes.","cloze":"…… marks zones of maximum risk such as engine intakes.","acc":["danger"],"dis":["Evacuate","Keep clear","Inflammable"],"uadis":["Підтягнути","Регулятор","Прошивка"],"k":"m1:DANGER","xu":"Небезпека позначає зони максимального ризику, як-от повітрозабірники двигуна."},{"en":"No Step","ua":"Не ставати iver can be crossed without a bridge.","acc":["ford"],"dis":["Crest","Going","Marshland"],"uadis":["Часткове бойове розпорядження","Бойові війська","Підтримка з боку країни перебування"],"k":"m2:Ford","xu":"Брід — це мілке місце, де річку можна перейти без мосту."},{"en":"Crossing point","ua":"Пункт переправи","ex":"A crossing point is any place selected for getting troops over an obstacle.","cloze":"A …… is any place selected for getting troops over an obstacle.","acc":["crossing point"],"dis":["Cover","Choke point","Canalize"],"uadis":["Наказ на застосування авіації","Мертвий простір","Посада"],"k":"m2:Crossing point","xu":"Пункт переправи — це будь-яке місце, обране для переходу військ через перешкоду."},{"en":"Going","ua":"Прохідність","ex":"The going describes how easily vehicles can move across a piece of ground.","cloze":"The …… describes how easily vehicles can move across a piece of ground.","acc":["going"],"dis":["Reverse slope","Crest","Obstacle"],"uadis":["Обмежувати спостереження","Полковник","Наказ на застосування авіації"],"k":"m2:Going","xu":"Прохідність описує, наскільки легко техніка може рухатися по ділянці ґрунту."}]},{"id":"m2:ff9b153c","title":"Рельєф і його використання — ч. 2","terms":[{"en":"Obstacle","ua":"Перешкода","ex":"An obstacle is any feature that stops or slows movement.","cloze":"An …… is any feature that stops or slows movement.","acc":["obstacle"],"dis":["Observation post","Ridge","Choke point"],"uadis":["Рядовий і сержантський склад","Медична евакуація","Вузькість, ключова протока"],"k":"m2:Obstacle","xu":"Перешкода — це будь-що, що зупиняє чи сповільнює рух."},{"en":"Choke point","ua":"Дефіле, вузьке місце","ex":"A choke point is a narrow passage where movement is restricted and forces become vulnerable.","cloze":"A …… is a narrow passage where movement is restricted and forces become vulnerable.","acc":["choke point"],"dis":["Going","Obstacle","Key terrain"],"uadis":["Розвивати успіх","Сержант","Напрямок зосередження основних зусиль"],"k":"m2:Choke point","xu":"Дефіле — це вузький прохід, де рух обмежений і сили стають вразливими."},{"en":"Canalize","ua":"Каналізувати рух","ex":"To canalize means to force the enemy to move along one narrow route.","cloze":"To …… means to force the enemy to move along one narrow route.","acc":["canalize"],"dis":["Key terrain","Defilade","Ford"],"uadis":["Підтримка з боку країни перебування","Полковник","Комунікаційна лінія"],"k":"m2:Canalize","xu":"Каналізувати рух означає змусити противника рухатися однією вузькою дорогою."},{"en":"Cover","ua":"Укриття від вогню","ex":"Cover is anything that protects troops from enemy fire.","cloze":"…… is anything that protects troops from enemy fire.","acc":["cover"],"dis":["Canalize","Dead ground","Ridge"],"uadis":["Військове звання","Каналізувати рух","Начальник штабу"],"k":"m2:Cover","xu":"Укриття від вогню — це будь-що, що захищає війська від вогню противника."},{"en":"Concealment","ua":"Маскування від спостереження","ex":"Concealment hides troops from observation but gives no protection from fire.","cloze":"…… hides troops from observation but gives no protection from fire.","acc":["concealment"],"dis":["Cover","Going","Marshland"],"uadis":["Формулювання завдання","Формування сил","Матеріальні засоби"],"k":"m2:Concealment","xu":"Маскування ховає війська від спостереження, але не захищає від вогню."},{"en":"Dead ground","ua":"Мертвий простір","ex":"Dead ground is ground that cannot be seen or covered by fire from a given position.","cloze":"…… is ground that cannot be seen or covered by fire from a given position.","acc":["dead ground"],"dis":["Observation post","Terrain","Crossing point"],"uadis":["Майор","Бойові війська","Передгір'я"],"k":"m2:Dead ground","xu":"Мертвий простір — це ділянка, яку не видно й не можна накрити вогнем із певної позиції."},{"en":"Defilade","ua":"Природне укриття","ex":"Defilade is the use of the shape of the ground to protect a position from fire and view.","cloze":"…… is the use of the shape of the ground to protect a position from fire and view.","acc":["defilade"],"dis":["Going","Ford","Terrain"],"uadis":["Пально-мастильні матеріали","Підпорядкований підрозділ","Відділ логістики (J4)"],"k":"m2:Defilade","xu":"Природне укриття — це використання форми рельєфу для захисту позиції від вогню й огляду."},{"en":"Reverse slope","ua":"Зворотний схил","ex":"A reverse slope is the side of a height facing away from the enemy.","cloze":"A …… is the side of a height facing away from the enemy.","acc":["reverse slope"],"dis":["Restrict observation","Foothills","Concealment"],"uadis":["Ескадрилья","Брід","Бойовий виліт"],"k":"m2:Reverse slope","xu":"Зворотний схил — це бік височини, звернений від противника."},{"en":"Field of fire","ua":"Сектор обстрілу","ex":"A field of fire is the area that a weapon can cover effectively from its position.","cloze":"A …… is the area that a weapon can cover effectively from its position.","acc":["field of fire"],"dis":["Choke point","Crest","Foothills"],"uadis":["Майор","Передгір'я","Офіцер зв'язку"],"k":"m2:Field of fire","xu":"Сектор обстрілу — це зона, яку зброя може ефективно накрити зі своєї позиції."},{"en":"Observation post","ua":"Спостережний пункт","ex":"An observation post is a position from which troops watch the enemy and report.","cloze":"An …… is a position from which troops watch the enemy and report.","acc":["observation post"],"dis":["Restrict observation","Valley","Crossing point"],"uadis":["Підводний човен","Організація для виконання завдання","Відділення"],"k":"m2:Observation post","xu":"Спостережний пункт — це позиція, з якої війська стежать за противником і доповідають."},{"en":"Restrict observation","ua":"Обмежувати спостереження","ex":"Dense forest and bad weather restrict observation across the area of operations.","cloze":"Dense forest and bad weather …… across the area of operations.","acc":["restrict observation"],"dis":["Ridge","Cover","Canalize"],"uadis":["Оперативний рівень","Есмінець","Прохідність"],"k":"m2:Restrict observation","xu":"Густий ліс і погана погода обмежують спостереження по всьому району операції."}]}],"texts":["terrain"],"drills":[0]},{"id":"6e8cef95","title":"Сухопутні війська","lessons":[{"id":"m2:e516956f","title":"Організаційна структура","terms":[{"en":"Corps","ua":"Корпус","ex":"A corps is a tactical grouping of two or more divisions.","cloze":"A …… is a tactical grouping of two or more divisions.","acc":["corps"],"dis":["Manoeuvre unit","Battalion","Combat arms"],"uadis":["Долина","Дивізія","Маневрений підрозділ"],"k":"m2:Corps","xu":"Корпус — це тактичне об'єднання з двох або більше дивізій."},{"en":"Division","ua":"Дивізія","ex":"A division is a tactical grouping of two or more brigades.","cloze":"A …… is a tactical grouping of two or more brigades.","acc":["division"],"dis":["Company","Combat arms","Platoon"],"uadis":["Піхота","Капрал, молодший сержант","Замисел командира"],"k":"m2:Division","xu":"Дивізія — це тактичне об'єднання з двох або більше бригад."},{"en":"Brigade","ua":"Бригада","ex":"A brigade is a tactical grouping of two or more battalions.","cloze":"A …… is a tactical grouping of two or more battalions.","acc":["brigade"],"dis":["Manoeuvre unit","Combat service support","Section"],"uadis":["Рота","Бойовий виліт","Боєприпаси і озброєння"],"k":"m2:Brigade","xu":"Бригада — це тактичне об'єднання з двох або більше батальйонів."},{"en":"Regiment","ua":"Полк","ex":"A regiment is a battalion-sized grouping in armour, artillery and some supporting arms.","cloze":"A …… is a battalion-sized grouping in armour, artillery and some supporting arms.","acc":["regiment"],"dis":["Unit","Division","Combat support"],"uadis":["Десантна операція","Перешкода","Прохідність"],"k":"m2:Regiment","xu":"Полк — це об'єднання розміром з батальйон у бронетанкових, артилерійських і деяких підтримувальних військах."},{"en":"Battalion","ua":"Батальйон","ex":"A battalion is a grouping of three or more companies.","cloze":"A …… is a grouping of three or more companies.","acc":["battalion"],"dis":["Combat support","Indirect fire","Formation"],"uadis":["Маскування від спостереження","Дефіле, вузьке місце","Перешкода"],"k":"m2:Battalion","xu":"Батальйон — це об'єднання з трьох або більше рот."},{"en":"Company","ua":"Рота","ex":"A company is a grouping of three or more platoons.","cloze":"A …… is a grouping of three or more platoons.","acc":["company"],"dis":["Formation","Armour","Reconnaissance"],"uadis":["Комунікаційна лінія","Пально-мастильні матеріали","Вогонь з закритих позицій"],"k":"m2:Company","xu":"Рота — це об'єднання з трьох або більше взводів."},{"en":"Platoon","ua":"Взвод","ex":"A platoon is a grouping of two or more sections, normally commanded by a lieutenant.","cloze":"A …… is a grouping of two or more sections, normally commanded by a lieutenant.","acc":["platoon"],"dis":["Combat arms","Manoeuvre unit","Infantry"],"uadis":["Каналізувати рух","Бригада","Донесення про обстановку"],"k":"m2:Platoon","xu":"Взвод — це об'єднання з двох або більше відділень, зазвичай під командуванням лейтенанта."},{"en":"Section","ua":"Відділення","ex":"A section is a small infantry grouping of eight to twelve soldiers.","cloze":"A …… is a small infantry grouping of eight to twelve soldiers.","acc":["section"],"dis":["Unit","Battalion","Division"],"uadis":["Флот","Підпорядкований підрозділ","Відділ логістики (J4)"],"k":"m2:Section","xu":"Відділення — це мале піхотне об'єднання з восьми-дванадцяти солдатів."},{"en":"Formation","ua":"З'єднання","ex":"A formation is a large body of troops such as a brigade or a division.","cloze":"A …… is a large body of troops such as a brigade or a division.","acc":["formation"],"dis":["Reconnaissance","Corps","Armour"],"uadis":["Оперативний відділ (J3)","Оперативний рівень","Взвод"],"k":"m2:Formation","xu":"З'єднання — це велике угруповання військ, як-от бригада чи дивізія."},{"en":"Unit","ua":"Частина, підрозділ","ex":"A unit is a body of troops with its own commander, most often a battalion.","cloze":"A …… is a body of troops with its own commander, most often a battalion.","acc":["unit"],"dis":["Reconnaissance","Brigade","Armour"],"uadis":["Командир частини","Укриття від вогню","Військове звання"],"k":"m2:Unit","xu":"Частина — це угруповання військ із власним командиром, найчастіше батальйон."}]},{"id":"m2:a1a8f052","title":"Роди військ і підтримка","terms":[{"en":"Combat arms","ua":"Бойові війська","ex":"The combat arms face the enemy and do most of the fighting.","cloze":"The …… face the enemy and do most of the fighting.","acc":["combat arms"],"dis":["Engineers","Manoeuvre unit","Unit"],"uadis":["Підпорядкований підрозділ","Підтримка від підрядників","Морська піхота"],"k":"m2:Combat arms","xu":"Бойові війська зустрічають противника й ведуть основну частину бою."},{"en":"Combat support","ua":"Бойове забезпечення","ex":"Combat support assists the fighting troops with artillery, engineers and communications.","cloze":"…… assists the fighting troops with artillery, engineers and communications.","acc":["combat support"],"dis":["Combat arms","Indirect fire","Section"],"uadis":["Формування сил","Панування в повітрі","Хребет"],"k":"m2:Combat support","xu":"Бойове забезпечення допомагає бойовим військам артилерією, інженерами й зв'язком."},{"en":"Combat service support","ua":"Тилове забезпечення","ex":"Combat service support provides administrative and logistic support to land forces.","cloze":"…… provides administrative and logistic support to land forces.","acc":["combat service support"],"dis":["Reconnaissance","Engineers","Company"],"uadis":["Бойове забезпечення","Часткове бойове розпорядження","Авіаційне крило"],"k":"m2:Combat service support","xu":"Тилове забезпечення надає адміністративну й логістичну підтримку сухопутним військам."},{"en":"Infantry","ua":"Піхота","ex":"The infantry are troops trained to fight on foot.","cloze":"The …… are troops trained to fight on foot.","acc":["infantry"],"dis":["Regiment","Platoon","Corps"],"uadis":["Посада","Попереднє бойове розпорядження","Підсилити"],"k":"m2:Infantry","xu":"Піхота — це війська, підготовлені воювати в пішому порядку."},{"en":"Armour","ua":"Бронетанкові війська","ex":"Armour comprises the tank units of an army.","cloze":"…… comprises the tank units of an army.","acc":["armour"],"dis":["Combat service support","Regiment","Combat support"],"uadis":["Молодший лейтенант","Сержант","Зворотний схил"],"k":"m2:Armour","xu":"Бронетанкові війська складаються з танкових підрозділів армії."},{"en":"Artillery","ua":"Артилерія","ex":"Artillery delivers indirect fire in support of the manoeuvre units.","cloze":"…… delivers indirect fire in support of the manoeuvre units.","acc":["artillery"],"dis":["Combat support","Indirect fire","Formation"],"uadis":["Розвідувальний відділ (J2)","Офіцер","Оперативний рівень"],"k":"m2:Artillery","xu":"Артилерія веде вогонь із закритих позицій на підтримку маневрених підрозділів."},{"en":"Engineers","ua":"Інженерні війська","ex":"Engineers build and clear obstacles and improve the mobility of the force.","cloze":"…… build and clear obstacles and improve the mobility of the force.","acc":["engineers"],"dis":["Indirect fire","Brigade","Company"],"uadis":["Організація для виконання завдання","Бригада","Гребінь"],"k":"m2:Engineers","xu":"Інженерні війська зводять і долають перешкоди та підвищують рухливість сил."},{"en":"Reconnaissance","ua":"Розвідка","ex":"Reconnaissance is carried out to gain information about the enemy and the ground.","cloze":"…… is carried out to gain information about the enemy and the ground.","acc":["reconnaissance"],"dis":["Company","Engineers","Combat service support"],"uadis":["Сектор обстрілу","Офіцер","Відділ планування (J5)"],"k":"m2:Reconnaissance","xu":"Розвідка ведеться, щоб здобути дані про противника й місцевість."},{"en":"Indirect fire","ua":"Вогонь з закритих позицій","ex":"Indirect fire is delivered at a target the gun crew cannot see.","cloze":"…… is delivered at a target the gun crew cannot see.","acc":["indirect fire"],"dis":["Unit","Manoeuvre unit","Division"],"uadis":["Сектор обстрілу","Бойові війська","Оперативний відділ (J3)"],"k":"m2:Indirect fire","xu":"Вогонь з закритих позицій ведеться по цілі, яку обслуга гармати не бачить."},{"en":"Manoeuvre unit","ua":"Маневрений підрозділ","ex":"A manoeuvre unit moves and fights to take ground from the enemy.","cloze":"A …… moves and fights to take ground from the enemy.","acc":["manoeuvre unit"],"dis":["Armour","Combat arms","Regiment"],"uadis":["Сектор обстрілу","Долина","Гребінь"],"k":"m2:Manoeuvre unit","xu":"Маневрений підрозділ рухається й веде бій, щоб відібрати місцевість у противника."}]}],"texts":[],"drills":[4]},{"id":"e351a115","title":"Повітряні сили","lessons":[{"id":"m2:1294a303","title":"Роль і завдання авіації","terms":[{"en":"Air superiority","ua":"Перевага в повітрі","ex":"Air superiority allows friendly air and ground operations without prohibitive interference from the enemy.","cloze":"…… allows friendly air and ground operations without prohibitive interference from the enemy.","acc":["air superiority"],"dis":["Air tasking order","Counter-air","Airlift"],"uadis":["Бригада","Логістика, тилове забезпечення","Командир частини"],"k":"m2:Air superiority","xu":"Перевага в повітрі дозволяє свої повітряні й наземні дії без надмірної протидії противника."},{"en":"Air supremacy","ua":"Панування в повітрі","ex":"Air supremacy means the enemy air force is no longer able to interfere at all.","cloze":"…… means the enemy air force is no longer able to interfere at all.","acc":["air supremacy"],"dis":["Squadron","Airlift","Sortie"],"uadis":["Офіцер","Рядовий і сержантський склад","Заболочена місцевість"],"k":"m2:Air supremacy","xu":"Панування в повітрі означає, що авіація противника вже взагалі не може протидіяти."},{"en":"Close air support","ua":"Безпосередня авіаційна підтримка","ex":"Close air support strikes targets that are an immediate threat to friendly troops.","cloze":"…… strikes targets that are an immediate threat to friendly troops.","acc":["close air support"],"dis":["Air supremacy","Air-to-air refuelling","Counter-air"],"uadis":["Рота","Полк","З'єднання"],"k":"m2:Close air support","xu":"Безпосередня авіаційна підтримка вражає цілі, що становлять безпосередню загрозу своїм військам."},{"en":"Air interdiction","ua":"Ізоляція району бойових дій","ex":"Air interdiction attacks enemy forces before they can be used against friendly troops.","cloze":"…… attacks enemy forces before they can be used against friendly troops.","acc":["air interdiction"],"dis":["Forward air controller","Air tasking order","Close air support"],"uadis":["Продовольчий пайок","Штабний персонал","Молодший лейтенант"],"k":"m2:Air interdiction","xu":"Ізоляція району бойових дій вражає сили противника, перш ніж їх застосують проти своїх військ."},{"en":"Strategic attack","ua":"Стратегічний удар","ex":"A strategic attack is aimed at weakening the adversary's ability and will to fight.","cloze":"A …… is aimed at weakening the adversary's ability and will to fight.","acc":["strategic attack"],"dis":["Air defence","Air interdiction","Squadron"],"uadis":["Передовий авіаційний навідник","Присвоєння звання","Мертвий простір"],"k":"m2:Strategic attack","xu":"Стратегічний удар спрямований на ослаблення здатності й волі противника воювати."},{"en":"Counter-air","ua":"Боротьба за перевагу в повітрі","ex":"Counter-air operations are conducted to gain and keep control of the air.","cloze":"…… operations are conducted to gain and keep control of the air.","acc":["counter-air"],"dis":["Close air support","Air supremacy","Squadron"],"uadis":["Підводний човен","Матеріальні засоби","Посада"],"k":"m2:Counter-air","xu":"Боротьба за перевагу в повітрі ведеться, щоб здобути й утримати контроль над повітрям."},{"en":"Sortie","ua":"Бойовий виліт","ex":"A sortie is one operational flight by a single aircraft.","cloze":"A …… is one operational flight by a single aircraft.","acc":["sortie"],"dis":["Air superiorit ance of an aircraft.","cloze":"…… extends the range and endurance of an aircraft.","acc":["air-to-air refuelling"],"dis":["Air tasking order","Wing","Counter-air"],"uadis":["Відійти","Молодший лейтенант","Боротьба за перевагу в повітрі"],"k":"m2:Air-to-air refuelling","xu":"Дозаправлення в повітрі збільшує дальність і тривалість польоту літака."},{"en":"Forward air controller","ua":"Передовий авіаційний навідник","ex":"A forward air controller directs attack aircraft onto targets from the ground.","cloze":"A …… directs attack aircraft onto targets from the ground.","acc":["forward air controller"],"dis":["No-fly zone","Air interdiction","Air-to-air refuelling"],"uadis":["Пально-мастильні матеріали","Полк","Підпорядкований підрозділ"],"k":"m2:Forward air controller","xu":"Передовий авіаційний навідник наводить ударну авіацію на цілі з землі."},{"en":"No-fly zone","ua":"Безполітна зона","ex":"A no-fly zone is airspace in which flights are prohibited.","cloze":"A …… is airspace in which flights are prohibited.","acc":["no-fly zone"],"dis":["Strategic attack","Air defence","Counter-air"],"uadis":["Підводний човен","Порядок підпорядкування","Боєприпаси і озброєння"],"k":"m2:No-fly zone","xu":"Безполітна зона — це повітряний простір, у якому польоти заборонені."},{"en":"Air defence","ua":"Протиповітряна оборона","ex":"Air defence protects friendly forces and areas against attack from the air.","cloze":"…… protects friendly forces and areas against attack from the air.","acc":["air defence"],"dis":["Air interdiction","Counter-air","Airlift"],"uadis":["Дивізія","Морська піхота","Демонстрація сили"],"k":"m2:Air defence","xu":"Протиповітряна оборона захищає свої війська й райони від нападу з повітря."}]}],"texts":["air"],"drills":[2]},{"id":"92c2fd26","title":"Військово-морські сили","lessons":[{"id":"m2:475140d4","title":"Флот і його завдання","terms":[{"en":"Fleet","ua":"Флот","ex":"A fleet comprises all the vessels operating in one ocean or general region.","cloze":"A …… c ня"],"k":"m2:Aircraft carrier","xu":"Авіаносець використовує літаки зі своєї палуби далеко від своїх аеродромів."},{"en":"Destroyer","ua":"Есмінець","ex":"A destroyer is a fast warship used to escort larger vessels and to attack surface targets.","cloze":"A …… is a fast warship used to escort larger vessels and to attack surface targets.","acc":["destroyer"],"dis":["Fleet","Frigate","Marines"],"uadis":["Тиловий район","Формулювання завдання","Флот"],"k":"m2:Destroyer","xu":"Есмінець — це швидкий бойовий корабель для ескорту більших суден і ударів по надводних цілях."},{"en":"Frigate","ua":"Фрегат","ex":"A frigate is a warship used mainly for escort duties and patrol.","cloze":"A …… is a warship used mainly for escort duties and patrol.","acc":["frigate"],"dis":["Submarine","Amphibious operation","Chokepoint"],"uadis":["Продовольчий пайок","Пально-мастильні матеріали","Обмежувати спостереження"],"k":"m2:Frigate","xu":"Фрегат — це бойовий корабель переважно для ескорту й патрулювання."},{"en":"Submarine","ua":"Підводний човен","ex":"A submarine operates below the surface and is difficult to detect.","cloze":"A …… operates below the surface and is difficult to detect.","acc":["submarine"],"dis":["Marines","Chokepoint","Show of force"],"uadis":["Часткове бойове розпорядження","Вузькість, ключова протока","Вище об'єднання"],"k":"m2:Submarine","xu":"Підводний човен діє під водою, і його важко виявити."},{"en":"Anti-submarine warfare","ua":"Протичовнова боротьба","ex":"Anti-submarine warfare is conducted to detect and destroy enemy submarines.","cloze":"…… is conducted to detect and destroy enemy submarines.","acc":["anti-submarine warfare"],"dis":["Task force","Amphibious operation","Marines"],"uadis":["Демонстрація сили","Сержант","Зворотний схил"],"k":"m2:Anti-submarine warfare","xu":"Протичовнова боротьба ведеться, щоб виявити й знищити підводні човни противника."},{"en":"Chokepoint","ua":"Вузькість, ключова протока","ex":"A chokepoint is a narrow stretch of sea through which trade and naval routes must pass.","cloze":"A …… is a narrow stretch of sea through which trade and naval routes must pass.","acc":["chokepoint"],"dis":["Submarine","Capital ship","Show of force"],"uadis":["Офіцер зв'язку","Бойове забезпечення","Каналізувати рух"],"k":"m2:Chokepoint","xu":"Вузькість — це вузька ділянка моря, через яку мають проходити торгові й військові маршрути."},{"en":"Show of force","ua":"Демонстрація сили","ex":"A show of force is the visible presence of warships used to deter aggression.","cloze":"A …… is the visible presence of warships used to deter aggression.","acc":["show of force"],"dis":["Marines","Chokepoint","Fleet"],"uadis":["Місцевість","Спостережний пункт","Ключова ділянка місцевості"],"k":"m2:Show of force","xu":"Демонстрація сили — це видима присутність бойових кораблів для стримування агресії."},{"en":"Marines","ua":"Морська піхота","ex":"Marines arrive by sea but conduct their operations on land.","cloze":"…… arrive by sea but conduct their operations on land.","acc":["marines"],"dis":["Destroyer","Task force","Capital ship"],"uadis":["Укриття від вогню","Майор","Формулювання завдання"],"k":"m2:Marines","xu":"Морська піхота прибуває морем, але веде дії на суходолі."},{"en":"Amphibious operation","ua":"Десантна операція","ex":"An amphibious operation lands forces from the sea onto a hostile shore.","cloze":"An …… lands forces from the sea onto a hostile shore.","acc":["amphibious operation"],"dis":["Show of force","Anti-submarine warfare","Task force"],"uadis":["Рядовий","Зворотний схил","Сержант, сержантський склад"],"k":"m2:Amphibious operation","xu":"Десантна операція висаджує сили з моря на ворожий берег."},{"en":"Littoral","ua":"Прибережна зона","ex":"The littoral is the coastal area where operations at sea and on land meet.","cloze":"The …… is the coastal area where operations at sea and on land meet.","acc":["littoral"],"dis":["Task group","Destroyer","Show of force"],"uadis":["Капітан","Відділення","Прохідність"] ear area","ua":"Тиловий район","ex":"The rear area lies behind the fighting troops and holds supply and support units.","cloze":"The …… lies behind the fighting troops and holds supply and support units.","acc":["rear area"],"dis":["Logistics","Sustainment","Contractor support"],"uadis":["Дозаправлення в повітрі","Маскування від спостереження","Відділення"],"k":"m2:Rear area","xu":"Тиловий район лежить за бойовими військами й містить підрозділи постачання й забезпечення."},{"en":"Medical evacuation","ua":"Медична евакуація","ex":"Medical evacuation, known as MEDEVAC, moves casualties to medical facilities.","cloze":"……, known as MEDEVAC, moves casualties to medical facilities.","acc":["medical evacuation"],"dis":["Ordnance","Line of communication","Force generation"],"uadis":["Мертвий простір","Передгір'я","Втрати, поранений"],"k":"m2:Medical evacuation","xu":"Медична евакуація, відома як MEDEVAC, переміщує поранених до медичних закладів."},{"en":"Casualty","ua":"Втрати, поранений","ex":"A casualty is a person lost to the force through death, wounds, sickness or capture.","cloze":"A …… is a person lost to the force through death, wounds, sickness or capture.","acc":["casualty"],"dis":["Contractor support","Force generation","Sustainment"],"uadis":["Підтримка від підрядників","Уорент-офіцер","Стратегічний удар"],"k":"m2:Casualty","xu":"Поранений — це людина, втрачена силами через загибель, поранення, хворобу чи полон."},{"en":"Force generation","ua":"Формування сил","ex":"Force generation is the provision of combat ready units for an operation.","cloze":"…… is the provision of combat ready units for an operation.","acc":["force generation"],"dis":["Sustainment","Resupply","Logistics"],"uadis":["Піхота","Заболочена місцевість","Оперативний відділ (J3)"],"k":"m2:Force generation","xu":"Формування сил — це надання боєготових підрозділів для операції."},{"en":"Readiness","ua":"Готовність","ex":"Readiness is the time a unit needs before it can deploy.","cloze":"…… is the time a unit needs before it can deploy.","acc":["readiness"],"dis":["Petroleum, oil and lubricants","Sustainment","Force generation"],"uadis":["Підтримка від підрядників","Повітряне перевезення","Мертвий простір"],"k":"m2:Readiness","xu":"Готовність — це час, потрібний підрозділу перед розгортанням."},{"en":"Host nation support","ua":"Підтримка з боку країни перебування","ex":"Host nation support is the assistance given by the country in which the force operates.","cloze":"…… is the assistance given by the country in which the force operates.","acc":["host nation support"],"dis":["Logistics","Casualty","Medical evacuation"],"uadis":["Пункт переправи","Рядовий","Полк"],"k":"m2:Host nation support","xu":"Підтримка з боку країни перебування — це допомога від країни, у якій діють сили."},{"en":"Contractor support","ua":"Підтримка від підрядників","ex":"Contractor support uses civilian companies to cover shortfalls in military capability.","cloze":"…… uses civilian companies to cover shortfalls in military capability.","acc":["contractor support"],"dis":["Readiness","Casualty","Host nation support"],"uadis":["Оперативний рівень","Гребінь","Офіцер"],"k":"m2:Contractor support","xu":"Підтримка від підрядників використовує цивільні компанії, щоб покрити нестачу військових спроможностей."}]}],"texts":["resup"],"drills":[]},{"id":"c0f24af0","title":"Бойові документи і завдання","lessons":[{"id":"m2:f13da06c","title":"Види наказів","terms":[{"en":"Warning order","ua":"Попереднє бойове розпорядження","ex":"A warning order gives subordinates early notice so that they can start their preparations.","cloze":"A …… gives subordinates early notice so that they can start their preparations.","acc":["warning order"],"dis":["Exploit","Mission statement","Operation order"],"uadis":["Комунікаційна лінія","Сектор обстрілу","Заболочена місцевість"],"k":"m2:Warning order","xu":"Попереднє бойове розпорядження дає підлеглим завчасне сповіщення, щоб почати підготовку."},{"en":"Operation order","ua":"Бойовий наказ","ex":"An operation order is the full set of instructions for carrying out an operation.","cloze":"An …… is the full set of instructions for carrying out an operation.","acc":["operation order"],"dis":["Concept of operations","Reinforce","Delay"],"uadis":["Капрал, молодший сержант","З'єднання","Порядок підпорядкування"],"k":"m2:Operation order","xu":"Бойовий наказ — це повний набір указівок для проведення операції."},{"en":"Fragmentary order","ua":"Часткове бойове розпорядження","ex":"A fragmentary order changes part of an order already issued, without repeating all of it.","cloze":"A …… changes part of an order already issued, without repeating all of it.","acc":["fragmentary order"],"dis":["Concept of operations","Seize","Rules of engagement"],"uadis":["Заболочена місцевість","Оперативний рівень","Панування в повітрі"],"k":"m2:Fragmentary order","xu":"Часткове бойове розпорядження змінює частину вже відданого наказу, не повторюючи його весь."},{"en":"Situation report","ua":"Донесення про обстановку","ex":"A situation report tells the headquarters what the unit's current position and state are.","cloze":"A …… tells the headquarters what the unit's current position and state are.","acc":["situation report"],"dis":["Screen","End state","Concept of operations"],"uadis":["Оперативне з'єднання","Укриття від вогню","Прикрити спостереженням"],"k":"m2:Situation report","xu":"Донесення про обстановку повідомляє штабу поточне положення й стан підрозділу."},{"en":"Mission statement","ua":"Формулювання завдання","ex":"A mission statement says who does what, where, when and, above all, why.","cloze":"A …… says who does what, where, when and, above all, why.","acc":["mission statement"],"dis":["End state","Main effort","Suppress"],"uadis":["Морська піхота","Бронетанкові війська","Дивізія"],"k":"m2:Mission statement","xu":"Формулювання завдання говорить, хто, що, де, коли і, найголовніше, навіщо робить."},{"en":"Commander's intent","ua":"Замисел командира","ex":"The commander's intent explains the purpose of the operation and the desired end state.","cloze":"The …… explains the purpose of the operation and the desired end state.","acc":["commander's intent"],"dis":["Mission statement","Warning order","Delay"],"uadis":["Логістика, тилове забезпечення","Сержант","Флот"],"k":"m2:Commander's intent","xu":"Замисел командира пояснює мету операції й бажаний кінцевий стан."},{"en":"Concept of operations","ua":"Задум операції","ex":"The concept of operations describes in outline how the mission will be accomplished.","cloze":"The …… describes in outline how the mission will be accomplished.","acc":["concept of operations"],"dis":["Screen","Reinforce","Secure"],"uadis":["Протиповітряна оборона","Комунікаційна лінія","Відділ логістики (J4)"],"k":"m2:Concept of operations","xu":"Задум операції описує в загальних рисах, як буде виконано завдання."},{"en":"End state","ua":"Кінцевий стан","ex":"The end state describes the situation the commander wants to see when the operation is over.","cloze":"The …… describes the situation the commander wants to see when the operation is over.","acc":["end state"],"dis":["Concept of operations","Seize","Commander's intent"],"uadis":["Бойове забезпечення","Частина, підрозділ","Корпус"],"k":"m2:End state","xu":"Кінцевий стан описує ситуацію, яку командир хоче бачити після завершення операції."},{"en":"Main effort","ua":"Напрямок зосередження основних зусиль","ex":"The main effort is the task whose success matters most to the whole operation.","cloze":"The …… is the task whose success matters most to the whole operation.","acc":["main effort"],"dis":["Commander's intent","Fragmentary order","Seize"],"uadis":["Прикрити спостереженням","Маневрений підрозділ","Медична евакуація"],"k":"m2:Main effort","xu":"Напрямок зосередження основних зусиль — це завдання, успіх якого найважливіший для всієї операції."},{"en":"Rules of engagement","ua":"Правила застосування сили","ex":"The rules of engagement define when and how force may be used.","cloze":"The …… define when and how force may be used.","acc":["rules of engagement"],"dis":["Screen","Withdraw","Commander's intent"],"uadis":["Бойове забезпечення","Бойові війська","Протичовнова боротьба"],"k":"m2:Rules of engagement","xu":"Правила застосування сили визначають, коли і як можна застосовувати силу."}]},{"id":"m2:ff639504","title":"Дієслова завдань НАТО","terms":[{"en":"Seize","ua":"Оволодіти","ex":"To seize means to take an objective from the enemy by force.","cloze":"To …… means to take an objective from the enemy by force.","acc":["seize"],"dis":["Screen","Destroy","Fragmentary order"],"uadis":["Відділення","Природне укриття","Правила застосування сили"],"k":"m2:Seize","xu":"Оволодіти означає силою відібрати об'єкт у противника."},{"en":"Secure","ua":"Забезпечити утримання","ex":"To secure means to gain and keep an area so that it cannot be used by the enemy.","cloze":"To …… means to gain and keep an area so that it cannot be used by the enemy.","acc":["secure"],"dis":["Mission statement","Withdraw","Suppress"],"uadis":["Оперативне з'єднання","Замисел командира","Ключова ділянка місцевості"],"k":"m2:Secure","xu":"Забезпечити утримання означає здобути й утримувати район, щоб ним не міг скористатися противник."},{"en":"Destroy","ua":"Знищити","ex":"To destroy means to damage an enemy force so badly that it cannot function until reconstituted.","cloze":"To …… means to damage an enemy force so badly that it cannot function until reconstituted.","acc":["destroy"],"dis":["Screen","Delay","Rules of engagement"],"uadis":["Капрал, молодший сержант","Розвідка","Піхота"],"k":"m2:Destroy","xu":"Знищити означає завдати сил противника такої шкоди, що вони не діятимуть до відновлення."},{"en":"Delay","ua":"Затримати","ex":"To delay means to slow the enemy down and gain time without becoming decisively engaged.","cloze":"To …… means to slow the enemy down and gain time without becoming decisively engaged.","acc":["delay"],"dis":["Commander's intent","Mission statement","Fragmentary order"],"uadis":["Оперативне з'єднання","Посада","Стратегічний удар"],"k":"m2:Delay","xu":"Затримати означає сповільнити противника й виграти час, не вступаючи у вирішальний бій."},{"en":"Block","ua":"Заблокувати","ex":"To block means to stop the enemy from moving along a particular route.","cloze":"To …… means to stop the enemy from moving along a particular route.","acc":["block"],"dis":["Mission statement","Suppress","Concept of operations"],"uadis":["Забезпечити утримання","Організація для виконання завдання","Бригада"],"k":"m2:Block","xu":"Заблокувати означає не дати противнику рухатися певним маршрутом."},{"en":"Screen","ua":"Прикрити спостереженням","ex":"To screen means to observe and give early warning of the enemy's approach.","cloze":"To …… means to observe and give early warning of the enemy's approach.","acc":["screen"],"dis":["Exploit","Reinforce","Suppress"],"uadis":["Продовольчий пайок","Есмінець","Втрати, поранений"],"k":"m2:Screen","xu":"Прикрити спостереженням означає вести спостереження й завчасно попереджати про наближення противника."},{"en":"Suppress","ua":"Придушити","ex":"To suppress means to reduce the effectiveness of the enemy's fire for a period of time.","cloze":"To …… means to reduce the effectiveness of the enemy's fire for a period of time.","acc":["suppress"],"dis":["Warning order","Secure","Concept of operations"],"uadis":["Рота","Обмежувати спостереження","Підпорядкований підрозділ"],"k":"m2:Suppress","xu":"Придушити означає на певний час знизити ефективність вогню противника."},{"en":"Exploit","ua":"Розвивати успіх","ex":"To exploit means to press on after a success in order to increase the advantage gained.","cloze":"To …… means to press on after a success in order to increase the advantage gained.","acc":["exploit"],"dis":["Fragmentary order","Block","Screen"],"uadis":["Комунікаційна лінія","Відділ кадрів (J1)","Фрегат"],"k":"m2:Exploit","xu":"Розвивати успіх означає наступати п ensive operation"],"uadis":["Рулити","Граната","Відсік озброєння"],"k":"m3:Defensive operation","xu":"Оборонна операція проводиться, щоб утримати місцевість і відбити напад."},{"en":"Engagement","ua":"Бойове зіткнення","ex":"An engagement is a fight between two opposing forces.","cloze":"An …… is a fight between two opposing forces.","acc":["engagement"],"dis":["Deception","Raid","Ambush"],"uadis":["Вартова служба","Швартування літака","Зовнішній огляд"],"k":"m3:Engagement","xu":"Бойове зіткнення — це бій між двома протилежними силами."},{"en":"Patrol","ua":"Дозор, патруль","ex":"A patrol is a small group sent out to gain information or to dominate an area.","cloze":"A …… is a small group sent out to gain information or to dominate an area.","acc":["patrol"],"dis":["Consolidation","Ambush","Raid"],"uadis":["Буксирувати","Боєприпас, що не зійшов","Небезпечна речовина"],"k":"m3:Patrol","xu":"Дозор — це мала група, вислана здобути дані або панувати над районом."},{"en":"Ambush","ua":"Засідка","ex":"An ambush is a surprise attack from a concealed position on a moving enemy.","cloze":"An …… is a surprise attack from a concealed position on a moving enemy.","acc":["ambush"],"dis":["Offensive operation","Patrol","Consolidation"],"uadis":["Підривник","Блокування вимкненого стану","Термін відрядження"],"k":"m3:Ambush","xu":"Засідка — це раптовий напад із прихованої позиції на рухомого противника."},{"en":"Raid","ua":"Наліт, рейд","ex":"A raid is a short attack with a planned withdrawal, not intended to hold ground.","cloze":"A …… is a short attack with a planned withdrawal, not intended to hold ground.","acc":["raid"],"dis":["Deception","Counterattack","Surprise"],"uadis":["Знешкодження вибухонебезпечних предметів","Підкріплення","Бойові боєприпаси"],"k":"m3:Raid","xu":"Наліт — це короткий напад із запланованим відходом, без наміру утримувати місцевість."},{"en":"Cordon","ua":"Оточення району, оцеплення","ex":"A cordon is a ring of troops placed around an area to control who enters and leaves.","cloze":"A …… is a ring of troops placed around an area to control who enters and leaves.","acc":["cordon"],"dis":["Patrol","Counterattack","Surprise"],"uadis":["Служба за призовом","Черга","Оперативне обслуговування"],"k":"m3:Cordon","xu":"Оточення району — це кільце військ навколо ділянки для контролю входу й виходу."},{"en":"Checkpoint","ua":"Блокпост","ex":"A checkpoint is a manned position where vehicles and people are stopped and checked.","cloze":"A …… is a manned position where vehicles and people are stopped and checked.","acc":["checkpoint"],"dis":["Offensive operation","Reinforcement","Ambush"],"uadis":["Авіаційна подія","Аварійна ситуація","Блокування вимкненого стану"],"k":"m3:Checkpoint","xu":"Блокпост — це обладнана позиція, де зупиняють і перевіряють техніку й людей."},{"en":"Breakthrough","ua":"Прорив","ex":"A breakthrough is made when an attacking force passes right through the enemy's defence.","cloze":"A …… is made when an attacking force passes right through the enemy's defence.","acc":["breakthrough"],"dis":["Raid","Surprise","Defensive operation"],"uadis":["Калібр","Боєприпаси у стрічці","Підкріплення"],"k":"m3:Breakthrough","xu":"Прорив відбувається, коли наступальні сили проходять наскрізь оборону противника."},{"en":"Counterattack","ua":"Контратака","ex":"A counterattack is an attack made by the defender to take back the initiative.","cloze":"A …… is an attack made by the defender to take back the initiative.","acc":["counterattack"],"dis":["Ambush","Raid","Engagement"],"uadis":["Гальмівний парашут","Відновлення аеродрому","Розслідування"],"k":"m3:Counterattack","xu":"Контратака — це напад, який здійснює оборонець, щоб повернути ініціативу."},{"en":"Encirclement","ua":"Оточення","ex":"Encirclement cuts an enemy force off from all routes of withdrawal and supply.","cloze":"…… cuts an enemy force off from all routes of withdrawal and supply.","acc":["encirclement"],"dis":["Surprise","Offensive operation","Reinforcement"], gets behind cover.","cloze":"A …… fires bombs at a high angle onto targets behind cover.","acc":["mortar"],"dis":["Dud","Sight","Burst"],"uadis":["Вітровказівник","Підривник","Контратака"],"k":"m3:Mortar","xu":"Міномет веде вогонь мінами по крутій траєкторії по цілях за укриттям."},{"en":"Grenade","ua":"Граната","ex":"A grenade is a small explosive weapon thrown by hand or fired from a launcher.","cloze":"A …… is a small explosive weapon thrown by hand or fired from a launcher.","acc":["grenade"],"dis":["Calibre","Effective range","Dud"],"uadis":["Небезпечний чинник","Оборонна операція","Закріплення на рубежі"],"k":"m3:Grenade","xu":"Граната — це мала вибухова зброя, яку кидають рукою чи запускають з підствольника."},{"en":"Calibre","ua":"Калібр","ex":"The calibre is the internal diameter of the barrel and defines the ammunition used.","cloze":"The …… is the internal diameter of the barrel and defines the ammunition used.","acc":["calibre"],"dis":["Round","Dud","Live ammunition"],"uadis":["Прохід із збором сторонніх предметів","Рулити","Диспетчерська вежа"],"k":"m3:Calibre","xu":"Калібр — це внутрішній діаметр ствола, що визначає застосовуваний боєприпас."},{"en":"Round","ua":"Постріл, патрон","ex":"A round is one complete item of ammunition ready to be fired.","cloze":"A …… is one complete item of ammunition ready to be fired.","acc":["round"],"dis":["Sight","Rate of fire","Small arms"],"uadis":["Протиобліднювальна обробка","Рульова доріжка","Розслідування"],"k":"m3:Round","xu":"Постріл — це один готовий до застосування боєприпас."},{"en":"Magazine","ua":"Магазин","ex":"A magazine holds rounds and feeds them into the weapon.","cloze":"A …… holds rounds and feeds them into the weapon.","acc":["magazine"],"dis":["Grenade","Sight","Rifle"],"uadis":["Боєприпас, що не спрацював","Дозор, патруль","Навчальний (інертний) боєприпас"],"k":"m3:Magazine","xu":"Магазин утримує набої й подає їх у зброю."},{"en":"Sight","ua":"Приціл","ex":"The sight is the device used to aim the
